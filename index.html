// ── 초기화 체크 ───────────────────────────────────────────────────
function checkReady(){
  if(!S.loadedTeams || !S.loadedRestaurants) return;
  if(S.screen === "loading"){
    if(S.myTeamDocId){
      const f = S.teams.find(t=>t.docId===S.myTeamDocId);
      if(f){ S.myTeam=f; S.screen="main"; loadRestaurantOrder().then(()=>render()); return; }
    }
    S.screen = "teamSelect";
  }
  render();
}

// ── Firebase ──────────────────────────────────────────────────────
function initFirebase(){
  onSnapshot(collection(db,"teams"), snap=>{
    if(snap.empty && !S.dataInitialized){
      S.dataInitialized=true; saveDefaultData(); return;
    }
    S.teams = snap.docs.map(d=>({...d.data(),docId:d.id}));
    S.teams.sort((a,b)=>{const na=parseInt(a.name),nb=parseInt(b.name);return isNaN(na)||isNaN(nb)?a.name.localeCompare(b.name,'ko'):na-nb;});
    // 지게차 팀 명단 항상 최신으로 동기화 (29명)
    const fkTeam=DEFAULT_TEAMS.find(t=>t.id==="tfk");
    const fkExisting=S.teams.find(t=>t.id==="tfk");
    if(fkTeam && (!fkExisting || fkExisting.members?.length!==fkTeam.members.length)){
      setDoc(doc(db,"teams","tfk"),fkTeam).catch(()=>{});
    }
    if(S.myTeam) S.myTeam = S.teams.find(t=>t.docId===S.myTeam.docId)||S.myTeam;
    S.loadedTeams = true;
    checkReady();
  });
  onSnapshot(collection(db,"restaurants"), snap=>{
    S.restaurants = snap.docs.map(d=>({...d.data(),docId:d.id}));
    if(!S.selectedRestaurantId && S.restaurants.length>0)
      S.selectedRestaurantId = getOrderedRestaurants()[0]?.docId || S.restaurants[0].docId;
    S.loadedRestaurants = true;
    checkReady();
  });
  onSnapshot(collection(db,"notices"), snap=>{
    S.notices = snap.docs.map(d=>({...d.data(),docId:d.id}))
      .sort((a,b)=>(b.timestamp||0)-(a.timestamp||0));
    if(S.screen==="main") render();
  });
  onSnapshot(collection(db,"phoneBook"), snap=>{
    S.phoneBooks = snap.docs.map(d=>({...d.data(),docId:d.id}))
      .sort((a,b)=>a.name.localeCompare(b.name,'ko'));
    if(S.screen==="main") render();
  });
  // 합석 요청 실시간
  onSnapshot(collection(db,"joinRequests"), snap=>{
    S.joinRequests = snap.docs.map(d=>({...d.data(),docId:d.id}))
      .filter(r=>r.status==="pending"||r.status==="accepted");
    if(S.screen==="main") render();
  });
  // 식당 순서 실시간 공유 (조별)
  onSnapshot(collection(db,"teamRestaurantOrder"), snap=>{
    if(!S.myTeam) return;
    const mine=snap.docs.find(d=>d.id===S.myTeam.docId);
    S.restaurantOrder=mine?(mine.data().order||[]):[];
    if(S.screen==="main") render();
  });
  // 최근 주문 실시간 공유 (조별)
  onSnapshot(collection(db,"recentOrders"), snap=>{
    if(!S.myTeam) return;
    const mine=snap.docs.find(d=>d.id===S.myTeam.docId);
    S.recentOrders=mine?(mine.data().orders||[]):[];
    if(S.screen==="main") render();
  });
  onSnapshot(collection(db,"orders"), snap=>{
    const today=todayKey(); const now=Date.now(); const TWO_H=2*60*60*1000;
    const all=snap.docs.map(d=>({...d.data(),docId:d.id}));
    S.allOrders = all.filter(o=>o.date===today && !(o.timestamp&&(now-o.timestamp)>TWO_H));
    // cleanup expired
    const expired=all.filter(o=>o.date!==today||(o.timestamp&&(now-o.timestamp)>TWO_H));
    if(expired.length>0){
      const b=writeBatch(db);
      expired.forEach(o=>b.delete(doc(db,"orders",o.docId)));
      b.commit().catch(()=>{});
    }
    if(S.screen==="main") render();
  });
}

async function saveDefaultData(){
  const batch=writeBatch(db);
  DEFAULT_TEAMS.forEach(t=>batch.set(doc(db,"teams",t.id),t));
  DEFAULT_RESTAURANTS.forEach(r=>batch.set(doc(db,"restaurants",r.id),r));
  await batch.commit();
}

// ── 최근 주문 (문자 전송 기록) ───────────────────────────────────
async function saveRecentOrder(restaurantName, orders){
  if(!S.myTeam) return;
  const record = {
    restaurantName,
    restaurantEmoji: S.restaurants.find(r=>r.name===restaurantName)?.emoji||"🍽",
    orders: orders.map(o=>({member:o.member, menu:o.menu, price:o.price})),
    total: orders.reduce((s,o)=>s+o.price,0),
    sentAt: new Date().toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}),
    date: todayKey(),
    timestamp: Date.now()
  };
  const existing = S.recentOrders;
  const newList = [record, ...existing].slice(0,10); // 최근 10개
  S.recentOrders = newList;
  try{
    await setDoc(doc(db,"recentOrders",S.myTeam.docId),{orders:newList, teamId:S.myTeam.docId});
  }catch(e){}
}
async function loadRecentOrders(){
  if(!S.myTeam) return;
  try{
    const d = await getDoc(doc(db,"recentOrders",S.myTeam.docId));
    S.recentOrders = d.exists()?(d.data().orders||[]):[];
  }catch(e){S.recentOrders=[];}
}

// ── 식당 순서 ─────────────────────────────────────────────────────
function getOrderedRestaurants(){
  if(!S.restaurantOrder || S.restaurantOrder.length===0) return [...S.restaurants];
  const ordered=[];
  S.restaurantOrder.forEach(id=>{const r=S.restaurants.find(r=>r.docId===id);if(r)ordered.push(r);});
  S.restaurants.forEach(r=>{if(!S.restaurantOrder.includes(r.docId))ordered.push(r);});
  return ordered;
}
async function loadRestaurantOrder(){
  if(!S.myTeam) return;
  try{
    const d=await getDoc(doc(db,"teamRestaurantOrder",S.myTeam.docId));
    S.restaurantOrder = d.exists()?(d.data().order||[]):[];
  }catch(e){S.restaurantOrder=[];}
}
async function saveRestaurantOrder(order){
  if(!S.myTeam) return;
  S.restaurantOrder=order;
  await setDoc(doc(db,"teamRestaurantOrder",S.myTeam.docId),{order,teamId:S.myTeam.docId});
}

  const list=getOrderedRestaurants().map(r=>r.docId);
  const idx=list.indexOf(docId); if(idx===-1) return;
  if(dir==="up"&&idx===0) return;
  if(dir==="down"&&idx===list.length-1) return;
  const swap=dir==="up"?idx-1:idx+1;
  [list[idx],list[swap]]=[list[swap],list[idx]];
  await saveRestaurantOrder(list); render();
}

async function submitBulkOrder(){
  const r=S.restaurants.find(r=>r.docId===S.bulkOrder); if(!r) return;
  const entries=Object.entries(S.bulkQty).filter(([,q])=>q>0);
  if(entries.length===0){showToast("⚠️ 수량을 선택해주세요");return;}

  // 각 수량만큼 주문 생성 (팀원 없이 단체주문으로)
  const batch=writeBatch(db);
  for(const [menuId,qty] of entries){
    const menu=r.menus?.find(m=>m.id===menuId); if(!menu) continue;
    for(let i=0;i<qty;i++){
      const id=`bulk_${uid()}`;
      const o={team:S.myTeam.name,member:`단체(${menu.name})`,restaurant:r.name,restaurantEmoji:r.emoji,
        menu:menu.name,price:menu.price,at:new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),
        date:todayKey(),timestamp:Date.now(),isBulk:true};
      batch.set(doc(db,"orders",id),o);
    }
  }
  await batch.commit();
  const totalQty=entries.reduce((s,[,q])=>s+q,0);
  S.bulkOrder=null; S.bulkQty={};
  showToast(`✅ 단체주문 ${totalQty}개 완료`);
}

function buildSMSBody(rData,orders){
  const menuCount={};
  orders.forEach(o=>{if(!menuCount[o.menu])menuCount[o.menu]={name:o.menu,price:o.price,count:0};menuCount[o.menu].count++;});
  const total=orders.reduce((s,o)=>s+o.price,0);
  const lines=Object.values(menuCount).map(m=>`• ${m.name} ${m.count}개 = ${fmt(m.count*m.price)}`);
  return [`안녕하세요, ${S.myTeam?.name||""} 입니다 :)`,``,`[${rData.emoji||"🍽"} ${rData.name} 주문]`,``,...lines,``,`총 ${orders.length}명 / 합계 ${fmt(total)}`,``,`감사합니다!`].join("\n");
}

  const rData=S.restaurants.find(r=>r.name===restaurantName);

async function sendJoinRequest(targetTeamDocId){
  const target=S.teams.find(t=>t.docId===targetTeamDocId);
  if(!target||!S.myTeam) return;
  // 이미 pending 요청 있는지 확인
  const existing=S.joinRequests.find(r=>r.fromTeamId===S.myTeam.docId&&r.status==="pending"&&r.date===todayKey());
  if(existing){showToast("⚠️ 이미 요청 중입니다");return;}
  // 현재 주문된 내역 수집
  const myOrdersNow=S.allOrders.filter(o=>o.team===S.myTeam.name);
  if(myOrdersNow.length===0){showToast("⚠️ 주문 내역이 없습니다. 먼저 주문하세요");return;}
  // 주문 스냅샷 저장
  const orderSnapshot=myOrdersNow.map(o=>({
    member:o.member, menu:o.menu, price:o.price,
    restaurant:o.restaurant, restaurantEmoji:o.restaurantEmoji
  }));
  const id=`jr_${uid()}`;
  await setDoc(doc(db,"joinRequests",id),{
    id,
    fromTeamId:S.myTeam.docId, fromTeamName:S.myTeam.name,
    toTeamId:targetTeamDocId, toTeamName:target.name,
    orderSnapshot, // 주문 내역 스냅샷
    status:"pending", timestamp:Date.now(),
    date:todayKey()
  });
  showToast(`✅ ${target.name}에 ${myOrdersNow.length}건 주문 토스!`);
  S.showJoinPanel=false; render();
}

async function acceptJoinRequest(docId){
  const r=S.joinRequests.find(r=>r.docId===docId); if(!r) return;
  // 주문 스냅샷을 우리 조 orders에 복사 (guestTeam 태그 붙여서)
  if(r.orderSnapshot&&r.orderSnapshot.length>0){
    const b=writeBatch(db);
    const at=new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"});
    r.orderSnapshot.forEach(o=>{
      const ref=doc(collection(db,"orders"));
      b.set(ref,{
        team:S.myTeam.name, // 우리 조 이름으로 저장
        member:o.member,
        restaurant:o.restaurant, restaurantEmoji:o.restaurantEmoji,
        menu:o.menu, price:o.price,
        at, date:todayKey(), timestamp:Date.now(),
        guestTeam:r.fromTeamName, // 지게차 표시용
        joinRequestId:docId
      });
    });
    await b.commit();
  }
  await setDoc(doc(db,"joinRequests",docId),{...r,status:"accepted",acceptedAt:Date.now()});
  showToast(`✅ ${r.fromTeamName} 주문 ${r.orderSnapshot?.length||0}건 수락!`);
}

function renderMain(){

  const T=sk();
  const fontMap={"default":"'Noto Sans KR','Apple SD Gothic Neo',sans-serif","gothic":"'Apple SD Gothic Neo','Noto Sans KR',sans-serif","serif":"Georgia,'Times New Roman',serif","mono":"'Courier New',Courier,monospace"};

  document.body.style.background=T.bg;

  const myOrders=S.allOrders.filter(o=>o.team===S.myTeam.name);
  const selR=getSelR();
  const members=getJoinedMembers();
  const myMembers=S.myTeam.members||[];
  // 내 조에 합석 요청 들어온 것 (pending)
  const incomingReqs=S.joinRequests.filter(r=>r.toTeamId===S.myTeam.docId&&r.status==="pending"&&r.date===todayKey());
  // 내 조가 보낸 요청
  const outgoingReq=S.joinRequests.find(r=>r.fromTeamId===S.myTeam.docId&&r.date===todayKey());
  const orderedR=getOrderedRestaurants();

  // 최근 주문한 식당 docId 순서 (중복제거, 최신순)
  const recentRIds=[...new Set(S.recentOrders.map(o=>S.restaurants.find(r=>r.name===o.restaurantName)?.docId).filter(Boolean))];
  // 최근주문 식당 먼저, 나머지는 orderedR 순서
  const tabRestaurants=[
    ...recentRIds.map(id=>orderedR.find(r=>r.docId===id)).filter(Boolean),
    ...orderedR.filter(r=>!recentRIds.includes(r.docId))
  ];
  // NEW: 이 조가 아직 본 적 없는 식당 (seenRestaurantIds에 없는 것)
  const rTabs=tabRestaurants.map((r,tabIdx)=>{
    const active=r.docId===S.selectedRestaurantId;
    const cnt=countByR(r.name);
    const isRecent=recentRIds.includes(r.docId);
    const isNew=!S.seenRestaurantIds.includes(r.docId);
    return `<div style="position:relative;flex-shrink:0;min-width:64px">
      <button data-rtab="${r.docId}" style="background:${active?"rgba(108,99,255,0.25)":isRecent?"rgba(255,157,60,0.1)":"rgba(255,255,255,0.04)"};border:2px solid ${active?"rgba(108,99,255,0.8)":isRecent?"rgba(255,157,60,0.35)":"rgba(255,255,255,0.08)"};border-radius:14px;padding:9px 10px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:${active?"#c4c0ff":isRecent?"#ff9d60":"#606080"};transition:all 0.18s;width:100%">
        <span style="font-size:20px">${r.emoji}</span>
        <span style="font-size:${S.fontSizes.restaurant}px;font-weight:700;white-space:nowrap">${r.name}</span>
        ${active?`<div data-show-menu="${r.docId}" style="background:rgba(108,99,255,0.35);border-radius:8px;padding:2px 8px;font-size:9px;color:#c4c0ff;font-weight:700;margin-top:1px;cursor:pointer">메뉴보기</div>`:`<div style="height:14px"></div>`}
      </button>
      ${cnt>0?`<span style="position:absolute;top:-5px;right:-5px;background:#ff6b6b;border-radius:20px;font-size:9px;padding:1px 5px;color:#fff;font-weight:800;pointer-events:none">${cnt}</span>`:""}
      ${isNew?`<span style="position:absolute;top:-5px;left:-5px;background:#6c63ff;border-radius:20px;font-size:8px;padding:1px 5px;color:#fff;font-weight:800;pointer-events:none">NEW</span>`:""}
      ${active?`<div style="position:absolute;bottom:-2px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#9d97ff;pointer-events:none"></div>`:""}
    </div>`;
  }).join("");

  // 전화번호부 탭 (맨 오른쪽 고정)
  const pbTab=`<div style="position:relative;flex-shrink:0;min-width:64px">
    <button id="phonebook-tab" style="background:${S.phoneBookOpen?"rgba(60,200,120,0.2)":"rgba(255,255,255,0.04)"};border:2px solid ${S.phoneBookOpen?"rgba(60,200,120,0.7)":"rgba(255,255,255,0.08)"};border-radius:14px;padding:9px 10px 5px;display:flex;flex-direction:column;align-items:center;gap:2px;color:${S.phoneBookOpen?"#60c880":"#606080"};transition:all 0.18s;width:100%">
      <span style="font-size:20px">📞</span>
      <span style="font-size:${S.fontSizes.restaurant}px;font-weight:700;white-space:nowrap">전화번호</span>
      <div style="height:14px"></div>
    </button>
    ${S.phoneBooks.length>0?`<span style="position:absolute;top:-5px;right:-5px;background:#60c880;border-radius:20px;font-size:9px;padding:1px 5px;color:#fff;font-weight:800;pointer-events:none">${S.phoneBooks.length}</span>`:""}
  </div>`;

  const menuPreview=""; // 제거됨

  // 내 이름 맨 앞 정렬 (총무모드 아닐 때)
  const myMember = members.find(m=>m.id===S.myMemberId);
  const sortedMembers = (!S.chiefMode && myMember)
    ? [myMember, ...members.filter(m=>m.id!==S.myMemberId)]
    : members;

  const memberGrid=sortedMembers.map(m=>{
    const order=getMyOrder(m.name); const done=!!order;
    const isMe = m.id===S.myMemberId && !S.chiefMode;
    return `<div style="position:relative;width:100%">
      <button data-member="${m.id}" style="background:${done?"rgba(60,200,120,0.12)":isMe?"rgba(108,99,255,0.15)":T.card};border:${isMe?"2px solid rgba(108,99,255,0.7)":"1.5px solid "+(done?"rgba(60,200,120,0.4)":T.border)};border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;transition:all 0.15s;width:100%;min-height:64px;position:relative">
        ${isMe?`<div style="position:absolute;top:4px;left:6px;font-size:8px;color:#9d97ff;font-weight:700">나</div>`:""}
        <div style="font-size:${S.fontSizes.member}px;font-weight:800;color:${done?"#60c880":isMe?"#c4c0ff":m.isGuest?"#ff9d60":"#d0d0e8"};text-align:center;line-height:1.3;word-break:keep-all">${m.name}</div>
        ${m.isGuest?`<div style="font-size:9px;color:#ff9d60;font-weight:700">${m.teamName}</div>`:""}
        ${done?`<div style="font-size:10px;color:#50a870;text-align:center;line-height:1.2;word-break:keep-all;padding:0 2px">${order.menu}</div>`:``}
      </button>
      ${m.isQuick?`<button data-quick-remove="${m.id}" style="position:absolute;top:-5px;right:-5px;background:#ff6060;border:none;border-radius:50%;width:18px;height:18px;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;z-index:10;line-height:1">×</button>`:""}
    </div>`;
  }).join("");

  // 현황
  let summaryHTML="";
  if(myOrders.length>0){
    const groups={};
    myOrders.forEach(o=>{if(!groups[o.restaurant])groups[o.restaurant]={name:o.restaurant,emoji:o.restaurantEmoji,items:[]};groups[o.restaurant].items.push(o);});
    const groupsHTML=Object.values(groups).map(g=>{
      const rData=S.restaurants.find(r=>r.name===g.name);
      const hasPhone=!!(rData?.phoneCall||rData?.phoneSMS);
      const menuCount={};
      g.items.forEach(o=>{if(!menuCount[o.menu])menuCount[o.menu]={name:o.menu,price:o.price,count:0};menuCount[o.menu].count++;});
      // 정산: 팀별 분리
      const teamSplit={};
      g.items.forEach(o=>{
        const tname=o.guestTeam||S.myTeam.name;
        if(!teamSplit[tname])teamSplit[tname]={name:tname,items:[],total:0};
        teamSplit[tname].items.push(o);
        teamSplit[tname].total+=o.price;
      });
      const splitTeams=Object.values(teamSplit);
      const splitHTML=splitTeams.length>1?splitTeams.map(ts=>`<div style="background:rgba(255,255,255,0.03);border-radius:8px;padding:7px 10px;margin-top:6px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:12px;color:#9090a0">${ts.name} (${ts.items.length}명)</span>
        <span style="font-size:13px;font-weight:800;color:#9d97ff">${fmt(ts.total)}</span>
      </div>`).join(""):"";
      return `<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:13px 14px;margin-bottom:10px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <div style="display:flex;align-items:center;gap:7px">
            <span style="font-size:20px">${g.emoji}</span>
            <div><div style="font-size:14px;font-weight:800;color:#fff">${g.name}</div><div style="font-size:11px;color:#5050a0">${g.items.length}명 주문</div></div>
          </div>
          <div style="display:flex;gap:6px">
            <button data-settlement="${g.name}" style="background:rgba(255,157,60,0.15);border:1px solid rgba(255,157,60,0.3);border-radius:20px;padding:6px 12px;font-size:12px;color:#ff9d60;font-weight:700">🧾 정산</button>
            <button data-sms-main="${g.name}" style="background:rgba(60,200,120,0.15);border:1px solid rgba(60,200,120,0.3);border-radius:20px;padding:6px 12px;font-size:12px;color:#60c880;font-weight:700">📱 문자</button>
            ${hasPhone?`<button data-call-main="${g.name}" style="background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);border-radius:20px;padding:6px 12px;font-size:12px;color:#9d97ff;font-weight:700">📞 전화</button>`:""}
          </div>
        </div>
        ${g.items.map(o=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
          <div style="display:flex;align-items:center;gap:8px">
            <div style="width:6px;height:6px;border-radius:50%;background:#6c63ff;flex-shrink:0"></div>
            <span style="font-size:${S.fontSizes.summary}px;font-weight:700;color:#e0e0f0">${o.member}</span>
            <span style="font-size:12px;color:#6060a0">${o.menu}</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:12px;color:#9d97ff;font-weight:700">${fmt(o.price)}</span>
            <button data-delete="${o.docId}" style="background:none;border:none;color:#ff6060;font-size:15px;line-height:1;padding:0">×</button>
          </div>
        </div>`).join("")}
        <div style="margin-top:8px;padding-top:7px;border-top:1px solid rgba(255,255,255,0.06)">
          ${Object.values(menuCount).map(m=>`<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:2px"><span style="color:#9090b0">${m.name} × ${m.count}</span><span style="color:#9d97ff;font-weight:700">${fmt(m.count*m.price)}</span></div>`).join("")}
          <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-top:5px;padding-top:5px;border-top:1px solid rgba(255,255,255,0.06)">
            <span style="color:#fff">소계</span><span style="color:#9d97ff">${fmt(g.items.reduce((s,o)=>s+o.price,0))}</span>
          </div>
          ${splitHTML?`<div style="margin-top:8px;padding-top:8px;border-top:1px dashed rgba(255,255,255,0.08)"><div style="font-size:10px;color:#5050a0;font-weight:700;margin-bottom:4px">📊 정산 (팀별)</div>${splitHTML}</div>`:""}
        </div>
      </div>`;
    }).join("");
    summaryHTML=`<div style="margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,0.07)">
      <div style="font-size:11px;color:#5050a0;letter-spacing:1px;margin-bottom:10px;font-weight:700">📋 주문 현황 · ${myOrders.length}건</div>
      ${groupsHTML}
      <div style="text-align:right;font-size:14px;font-weight:800;color:#fff;margin-top:2px">총 합계: <span style="color:#9d97ff">${fmt(myOrders.reduce((s,o)=>s+o.price,0))}</span></div>
    </div>`;
  }

  return `<div style="height:100vh;background:#0d0d1a;display:flex;flex-direction:column;overflow:hidden">
    <!-- 헤더 -->
    <div style="background:${T.header};border-bottom:1px solid ${T.border};padding:11px 13px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="font-size:17px">🍽</span>
        <div><div style="font-size:9px;color:#5050a0;letter-spacing:2px">TEAM MEAL</div><div style="font-size:15px;font-weight:900;color:#fff;line-height:1.2">${S.myTeam.name} 식사 주문</div></div>
      </div>
      <div style="display:flex;align-items:center;gap:6px">
        <button id="notice-btn" style="background:${S.notices.length>0?"linear-gradient(135deg,rgba(255,107,107,0.25),rgba(108,99,255,0.25))":"rgba(255,255,255,0.07)"};border:1.5px solid ${S.notices.length>0?"rgba(255,107,107,0.5)":"rgba(255,255,255,0.12)"};border-radius:20px;padding:5px 11px;font-size:11px;color:${S.notices.length>0?"#ff9d9d":"#808090"};font-weight:700;display:flex;align-items:center;gap:5px;position:relative">
          📢 공지
          ${S.notices.length>0?`<span style="background:#ff6b6b;border-radius:20px;font-size:9px;padding:1px 5px;color:#fff;font-weight:800">${S.notices.length}</span>`:""}
        </button>
        <button id="live-btn" style="background:rgba(255,107,107,0.15);border:1px solid rgba(255,107,107,0.3);border-radius:20px;padding:5px 10px;font-size:11px;color:#ff9d9d;font-weight:700;display:flex;align-items:center;gap:4px">
          <span style="width:5px;height:5px;border-radius:50%;background:#ff6b6b;display:inline-block;animation:pulse 1.5s infinite"></span>LIVE
        </button>
        <span style="font-size:10px;color:#404060;font-weight:600">${VERSION}</span>
        <div style="background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);border-radius:20px;padding:3px 9px;font-size:11px;color:#9d97ff;font-weight:700">${myOrders.length}/${myMembers.length}${members.length>myMembers.length?`+${members.length-myMembers.length}`:""}</div>
        ${S.chiefMode?`<button id="join-btn" style="background:${(outgoingReq||incomingReqs.length>0)?"rgba(108,99,255,0.25)":"rgba(255,255,255,0.07)"};border:1px solid ${(outgoingReq||incomingReqs.length>0)?"rgba(108,99,255,0.5)":"rgba(255,255,255,0.12)"};border-radius:10px;padding:0 10px;height:33px;font-size:11px;font-weight:800;color:${(outgoingReq||incomingReqs.length>0)?"#c4c0ff":"#808090"};white-space:nowrap;position:relative">
          🤝${incomingReqs.length>0?`<span style="position:absolute;top:-4px;right:-4px;background:#ff6b6b;border-radius:50%;width:14px;height:14px;font-size:9px;color:#fff;display:flex;align-items:center;justify-content:center">${incomingReqs.length}</span>`:""}
        </button>`:``}
        <button id="chief-btn" style="background:${S.chiefMode?"linear-gradient(135deg,#ff9d60,#ffb860)":"rgba(255,255,255,0.07)"};border:1px solid ${S.chiefMode?"rgba(255,157,60,0.6)":"rgba(255,255,255,0.12)"};border-radius:10px;padding:0 10px;height:33px;font-size:11px;font-weight:800;color:${S.chiefMode?"#fff":"#808090"};white-space:nowrap">
          ${S.chiefMode?"👑 총무":"총무"}
        </button>
        <button id="settings-btn" style="background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.12);border-radius:10px;width:33px;height:33px;display:flex;align-items:center;justify-content:center;font-size:16px">⚙️</button>
      </div>
    </div>
    <!-- 식당 탭 (최근주문 먼저, NEW 마크) -->
    <div style="padding:7px 11px 6px;background:${T.header};border-bottom:1px solid ${T.border};flex-shrink:0">
      <div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:2px">${rTabs}${pbTab}</div>
    </div>

    <!-- 최근주문 탭 -->
    ${S.recentOrders.length>0?`<div style="border-bottom:1px solid rgba(255,255,255,0.06);background:rgba(255,255,255,0.01);flex-shrink:0">
      <div style="display:flex;align-items:stretch;overflow-x:auto">
        <button id="recent-tab-toggle" style="flex-shrink:0;background:none;border:none;border-bottom:2px solid ${S.recentTab?"#ff9d60":"transparent"};padding:7px 14px;font-size:11px;font-weight:700;color:${S.recentTab?"#ff9d60":"#505070"};display:flex;align-items:center;gap:5px;white-space:nowrap">
          🕐 최근주문
          <span style="background:rgba(255,157,96,0.25);border-radius:20px;padding:1px 6px;font-size:9px;color:#ff9d60">${S.recentOrders.length}</span>
        </button>
        ${S.recentTab?S.recentOrders.slice(0,8).map((ro,i)=>`
          <button data-recent="${i}" style="flex-shrink:0;background:none;border:none;border-left:1px solid rgba(255,255,255,0.06);border-bottom:2px solid transparent;padding:7px 11px;display:flex;align-items:center;gap:5px;white-space:nowrap">
            <span style="font-size:14px">${ro.restaurantEmoji}</span>
            <div style="text-align:left">
              <div style="font-size:11px;font-weight:700;color:#c0c0d8">${ro.restaurantName}</div>
              <div style="font-size:9px;color:#404060">${ro.sentAt}</div>
            </div>
          </button>`).join(""):""}
      </div>
    </div>`:""}

    <!-- 컨텐츠 -->
    <div style="flex:1;overflow-y:auto;padding:10px 11px 30px">

      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:7px">
        ${memberGrid}
        ${S.quickAddMode?`
        <div style="background:rgba(108,99,255,0.12);border:1.5px solid rgba(108,99,255,0.5);border-radius:12px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:64px">
          <input id="quick-add-input" placeholder="이름" value="${S.quickAddName}" autofocus style="width:100%;background:rgba(255,255,255,0.1);border:1px solid rgba(108,99,255,0.4);border-radius:7px;padding:5px 6px;color:#fff;font-size:12px;outline:none;text-align:center"/>
          <div style="display:flex;gap:4px;width:100%">
            <button id="quick-add-confirm" style="flex:1;background:linear-gradient(135deg,#6c63ff,#9d97ff);border:none;border-radius:6px;padding:4px 0;color:#fff;font-size:11px;font-weight:700">추가</button>
            <button id="quick-add-cancel" style="flex:1;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;padding:4px 0;color:#9090c0;font-size:11px">취소</button>
          </div>
        </div>`:`
        <button id="add-member-quick" style="background:rgba(108,99,255,0.08);border:1.5px dashed rgba(108,99,255,0.3);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:64px;transition:all 0.15s">
          <div style="font-size:20px;color:#6c63ff">+</div>
          <div style="font-size:10px;color:#5050a0;font-weight:700">인원추가</div>
        </button>`}
      </div>
      ${myOrders.length>0?`<div style="display:flex;justify-content:center;margin-top:14px"><button id="reset-btn" style="background:rgba(255,80,80,0.1);border:1px solid rgba(255,80,80,0.25);border-radius:20px;padding:8px 24px;font-size:12px;color:#ff8080;font-weight:700">🗑 주문 초기화</button></div>`:""}
      ${summaryHTML}
    </div>
  </div>
  ${S.showSettlement?renderSettlement(S.showSettlement):""}
  ${S.showJoinPanel?renderJoinPanel():""}
  ${renderJoinIncomingAlert()}
  ${S.phoneBookOpen?renderPhoneBookPanel():""}
  ${S.noticePopup?renderNoticePopup():""}
  ${S.bulkOrder?renderBulkOrder():""}
  ${S.restaurantMenuPopup?renderRestaurantMenuPopup():""}
  ${S.menuSheet?renderMenuSheet():""}
  ${S.recentDetailIdx!==null?renderRecentOrderDetail(S.recentDetailIdx):""}
  ${S.liveBoard?renderLiveBoard():""}
  ${S.settings?renderSettings():""}
  ${S.restaurantPopup?renderRestaurantPopup():""}
  ${S.toast?`<div style="position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(20,20,50,0.97);backdrop-filter:blur(8px);border:1px solid rgba(108,99,255,0.4);border-radius:50px;padding:10px 20px;font-size:13px;font-weight:700;color:#fff;z-index:600;white-space:nowrap;animation:fadeUp 0.2s ease">${S.toast}</div>`:""}`;
}

// ── 메뉴 시트 (탭: 최근주문 / 인기순 / 가나다순) ────────────────
function renderMenuSheet(){
  const r=getSelR(); if(!r) return "";
  const member=S.menuSheet.member;
  const existing=S.allOrders.filter(o=>o.team===S.myTeam.name&&o.member===member.name);
  const existingNames=existing.map(o=>o.menu).join(", ");

  const menuCounts={};
  S.allOrders.filter(o=>o.restaurant===r.name).forEach(o=>{menuCounts[o.menu]=(menuCounts[o.menu]||0)+1;});

  const myRecentOrders=S.recentOrders
    .filter(ro=>ro.restaurantName===r.name)
    .flatMap(ro=>ro.orders.filter(o=>o.member===member.name))
    .slice(0,5);

  const popularMenus=[...(r.menus||[])].sort((a,b)=>(menuCounts[b.name]||0)-(menuCounts[a.name]||0));
  const alphaMenus=[...(r.menus||[])].sort((a,b)=>a.name.localeCompare(b.name,'ko'));

  // 복수선택 총액
  const multiTotal=S.selectedMenus.reduce((s,m)=>s+m.price,0);

  const menuCard=(menu)=>{
    const singleActive=!S.multiSelect&&S.selectedMenu?.id===menu.id;
    // 복수선택에서 이 메뉴 몇 개 선택됐는지
    const multiCount=S.multiSelect?S.selectedMenus.filter(m=>m.id===menu.id).length:0;
    const isMultiSelected=multiCount>0;
    const cnt=menuCounts[menu.name]||0;
    const active=singleActive||isMultiSelected;
    return `<button data-menu="${menu.id}" style="background:${active?"rgba(108,99,255,0.28)":"rgba(255,255,255,0.05)"};border:2px solid ${active?"rgba(108,99,255,0.8)":"rgba(255,255,255,0.09)"};border-radius:14px;padding:11px 7px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;width:100%;position:relative;min-height:70px">

// ── 식당 메뉴 팝업 (메뉴명+가격만, 인기5개 상단) ────────────────
function renderRestaurantMenuPopup(){
  const r=S.restaurants.find(r=>r.docId===S.restaurantMenuPopup); if(!r) return "";
  const allMenuCounts={};
  S.allOrders.filter(o=>o.restaurant===r.name).forEach(o=>{allMenuCounts[o.menu]=(allMenuCounts[o.menu]||0)+1;});
  const sortedMenus=[...(r.menus||[])].sort((a,b)=>(allMenuCounts[b.name]||0)-(allMenuCounts[a.name]||0));
  const top5=sortedMenus.filter(m=>allMenuCounts[m.name]>0).slice(0,5);
  const restMenus=sortedMenus.filter(m=>!top5.includes(m));

  const menuRow=(m,idx,isTop)=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-bottom:1px solid rgba(255,255,255,0.05);background:${isTop?"rgba(108,99,255,0.06)":"transparent"}">
    <div style="display:flex;align-items:center;gap:8px">
      ${isTop?`<span style="font-size:14px">${["🥇","🥈","🥉","4위","5위"][idx]||""}</span>`:`<span style="font-size:11px;color:#404060;width:16px;text-align:center">${idx+1}</span>`}
      <span style="font-size:15px;font-weight:600;color:#e0e0f0">${m.name}</span>
      ${isTop&&allMenuCounts[m.name]?`<span style="font-size:10px;background:rgba(255,107,107,0.2);border-radius:20px;padding:1px 6px;color:#ff9d9d;font-weight:700">${allMenuCounts[m.name]}명</span>`:""}
    </div>
    <span style="font-size:15px;font-weight:800;color:#9d97ff;flex-shrink:0">${fmt(m.price)}</span>
  </div>`;

  return `<div style="position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;justify-content:flex-start">
    <div id="rmp-bg" style="position:absolute;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px)"></div>
    <div style="position:relative;z-index:1;background:#13132a;border-bottom:1px solid rgba(255,255,255,0.1);border-radius:0 0 22px 22px;max-height:85vh;display:flex;flex-direction:column;overflow:hidden;animation:slideDown 0.25s ease">
      <!-- 헤더 -->
      <div style="padding:13px 16px 10px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.07)">
        <div style="display:flex;align-items:center;gap:9px">
          <span style="font-size:26px">${r.emoji}</span>
          <div><div style="font-size:16px;font-weight:900;color:#fff">${r.name}</div><div style="font-size:11px;color:#5050a0">${(r.menus||[]).length}개 메뉴</div></div>
        </div>
        <button id="rmp-close" style="background:rgba(255,255,255,0.07);border:none;border-radius:50%;width:32px;height:32px;color:#9090c0;font-size:15px;display:flex;align-items:center;justify-content:center">✕</button>
      </div>
      <!-- 인기 5개 -->
      ${top5.length>0?`<div style="flex-shrink:0">
        <div style="padding:7px 16px 4px;font-size:10px;color:#6c63ff;font-weight:700;letter-spacing:1px">🏆 인기메뉴</div>
        ${top5.map((m,i)=>menuRow(m,i,true)).join("")}
        <div style="height:6px;background:rgba(0,0,0,0.3)"></div>
      </div>`:""}
      <!-- 전체 메뉴 -->
      <div style="overflow-y:auto;flex:1">
        ${top5.length>0?`<div style="padding:7px 16px 4px;font-size:10px;color:#5050a0;font-weight:700;letter-spacing:1px">전체 메뉴</div>`:""}
        ${restMenus.length>0?restMenus.map((m,i)=>menuRow(m,i,false)).join(""):`${top5.length===0?sortedMenus.map((m,i)=>menuRow(m,i,false)).join(""):`<div style="text-align:center;padding:16px;color:#404060;font-size:12px">추가 메뉴 없음</div>`}`}
      </div>
      <!-- 선택하기 -->
      <div style="padding:10px 14px 16px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.07);display:flex;gap:8px">
        <button id="rmp-bulk" style="flex:1;height:44px;background:rgba(255,157,60,0.15);border:1.5px solid rgba(255,157,60,0.4);border-radius:12px;color:#ff9d60;font-size:13px;font-weight:800">🛒 단체주문</button>
        <button id="rmp-order" style="flex:1;height:44px;background:linear-gradient(135deg,#6c63ff,#9d97ff);border:none;border-radius:12px;color:#fff;font-size:13px;font-weight:800">메뉴 선택하기 →</button>
      </div>
    </div>
  </div>`;
}

function renderSettlement(restaurantName){
  const rOrders=S.allOrders.filter(o=>
    (o.team===S.myTeam.name||o.guestTeam===S.myTeam.name||
     (o.team===S.myTeam.name))&&o.restaurant===restaurantName
  );
  const r=S.restaurants.find(r=>r.name===restaurantName);

  // 팀별 그룹
  const teamGroups={};
  rOrders.forEach(o=>{
    const tname=o.guestTeam||o.team;
    if(!teamGroups[tname])teamGroups[tname]={name:tname,orders:[],total:0,isGuest:o.guestTeam===tname};
    teamGroups[tname].orders.push(o);
    teamGroups[tname].total+=o.price;
  });

  // 메뉴별 집계 (전체)
  const menuCount={};
  rOrders.forEach(o=>{if(!menuCount[o.menu])menuCount[o.menu]={name:o.menu,price:o.price,count:0};menuCount[o.menu].count++;});
  const grandTotal=rOrders.reduce((s,o)=>s+o.price,0);

  const teamRows=Object.values(teamGroups).map(tg=>`
    <div style="margin-bottom:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,0.08)">
        <div style="font-size:14px;font-weight:800;color:${tg.isGuest?"#ff9d60":"#9d97ff"}">${tg.isGuest?"🤝 ":"👥 "}${tg.name}</div>
        <div style="font-size:15px;font-weight:900;color:#fff">${fmt(tg.total)}</div>
      </div>
      ${tg.orders.map(o=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,0.04)">
        <div>
          <span style="font-size:14px;font-weight:700;color:#e0e0f0">${o.member}</span>
          <span style="font-size:12px;color:#6060a0;margin-left:8px">${o.menu}</span>
        </div>
        <span style="font-size:13px;font-weight:700;color:#9d97ff">${fmt(o.price)}</span>
      </div>`).join("")}
    </div>`).join("");

  const menuRows=Object.values(menuCount).map(m=>`
    <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.05)">
      <span style="font-size:13px;color:#c0c0d8">${m.name} × ${m.count}</span>
      <span style="font-size:13px;font-weight:700;color:#9d97ff">${fmt(m.count*m.price)}</span>
    </div>`).join("");

  return `<div style="position:fixed;inset:0;z-index:350;background:#0d0d1a;display:flex;flex-direction:column;animation:fadeUp 0.25s ease">
    <!-- 헤더 -->
    <div style="padding:16px 16px 12px;background:rgba(255,255,255,0.03);border-bottom:1px solid rgba(255,255,255,0.08);flex-shrink:0;display:flex;align-items:center;justify-content:space-between">
      <div>
        <div style="font-size:10px;color:#5050a0;letter-spacing:2px;font-weight:700">SETTLEMENT</div>
        <div style="font-size:18px;font-weight:900;color:#fff">${r?.emoji||"🍽"} ${restaurantName} 정산서</div>
      </div>
      <button id="settle-close" style="background:rgba(255,255,255,0.07);border:none;border-radius:50%;width:34px;height:34px;color:#9090c0;font-size:16px;display:flex;align-items:center;justify-content:center">✕</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:16px 15px 30px">
      <!-- 팀별 정산 -->
      <div style="margin-bottom:20px">
        <div style="font-size:11px;color:#5050a0;font-weight:700;letter-spacing:1px;margin-bottom:10px">👥 팀별 정산</div>
        ${teamRows}
      </div>
      <!-- 메뉴별 집계 -->
      <div style="background:rgba(108,99,255,0.07);border:1px solid rgba(108,99,255,0.2);border-radius:14px;padding:14px;margin-bottom:16px">
        <div style="font-size:11px;color:#6c63ff;font-weight:700;letter-spacing:1px;margin-bottom:10px">🍽 메뉴별 주문 현황</div>
        ${menuRows}
      </div>
      <!-- 합계 -->
      <div style="background:linear-gradient(135deg,rgba(108,99,255,0.15),rgba(157,151,255,0.1));border:1px solid rgba(108,99,255,0.3);border-radius:14px;padding:16px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <span style="font-size:13px;color:#9090a0">총 인원</span>
          <span style="font-size:15px;font-weight:800;color:#fff">${rOrders.length}명</span>
        </div>
        ${Object.values(teamGroups).length>1?Object.values(teamGroups).map(tg=>`
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
          <span style="font-size:12px;color:${tg.isGuest?"#ff9d60":"#9d97ff"}">${tg.name} (${tg.orders.length}명)</span>
          <span style="font-size:14px;font-weight:700;color:${tg.isGuest?"#ff9d60":"#9d97ff"}">${fmt(tg.total)}</span>
        </div>`).join(""):""}
        <div style="display:flex;justify-content:space-between;align-items:center;padding-top:10px;border-top:1px solid rgba(255,255,255,0.1);margin-top:6px">
          <span style="font-size:15px;font-weight:800;color:#fff">합계</span>
          <span style="font-size:22px;font-weight:900;color:#9d97ff">${fmt(grandTotal)}</span>
        </div>
      </div>
    </div>
  </div>`;
}

// ── 단체주문 화면 ────────────────────────────────────────────────
function renderBulkOrder(){
  const r=S.restaurants.find(r=>r.docId===S.bulkOrder); if(!r) return "";

  // 인기순 정렬
  const menuCounts={};
  S.allOrders.filter(o=>o.restaurant===r.name).forEach(o=>{menuCounts[o.menu]=(menuCounts[o.menu]||0)+1;});
  const sortedMenus=[...(r.menus||[])].sort((a,b)=>(menuCounts[b.name]||0)-(menuCounts[a.name]||0));

  const totalQty=Object.values(S.bulkQty).reduce((s,q)=>s+q,0);
  const totalPrice=Object.entries(S.bulkQty).reduce((s,[mid,q])=>{
    const m=r.menus?.find(m=>m.id===mid); return s+(m?.price||0)*q;
  },0);

  const cards=sortedMenus.map(m=>{
    const qty=S.bulkQty[m.id]||0;
    const cnt=menuCounts[m.name]||0;
    return `<div style="background:${qty>0?"rgba(255,157,60,0.12)":"rgba(255,255,255,0.05)"};border:2px solid ${qty>0?"rgba(255,157,60,0.5)":"rgba(255,255,255,0.09)"};border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative">
      ${cnt>0?`<span style="position:absolute;top:-6px;right:-6px;background:#ff6b6b;border-radius:20px;font-size:8px;padding:1px 5px;color:#fff;font-weight:800">${cnt}</span>`:""}
      <div style="font-size:${S.fontSizes.menu}px;font-weight:700;color:${qty>0?"#ff9d60":"#d0d0e8"};text-align:center;line-height:1.3;word-break:keep-all;padding:0 2px;min-height:32px;display:flex;align-items:center;justify-content:center">${m.name}</div>
      <div style="font-size:13px;font-weight:800;color:${qty>0?"#ffb860":"#9090b0"}">${fmt(m.price)}</div>
      <div style="display:flex;align-items:center;gap:0;background:rgba(255,255,255,0.07);border-radius:20px;overflow:hidden">
        <button data-bulk-minus="${m.id}" style="background:none;border:none;width:30px;height:30px;color:${qty>0?"#ff6060":"#404060"};font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1">−</button>
        <div style="min-width:24px;text-align:center;font-size:14px;font-weight:800;color:${qty>0?"#ff9d60":"#505060"}">${qty||0}</div>
        <button data-bulk-plus="${m.id}" style="background:none;border:none;width:30px;height:30px;color:#9d97ff;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1">+</button>
      </div>
    </div>`;
  }).join("");

  return `<div style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;justify-content:flex-start;background:rgba(0,0,0,0.85);backdrop-filter:blur(6px)">
    <div style="background:#13132a;border-bottom:1px solid rgba(255,255,255,0.1);border-radius:0 0 22px 22px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:slideDown 0.25s ease">

      <!-- 헤더 -->
      <div style="padding:13px 15px 10px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.07)">
        <div>
          <div style="font-size:17px;font-weight:900;color:#fff">${r.emoji} ${r.name} · 단체주문</div>
          <div style="font-size:11px;color:#6060a0;margin-top:2px">+ - 로 수량 선택 후 주문하기</div>
        </div>
        <button id="bulk-close" style="background:rgba(255,255,255,0.07);border:none;border-radius:50%;width:30px;height:30px;color:#9090c0;font-size:13px;display:flex;align-items:center;justify-content:center">✕</button>
      </div>

      <!-- 메뉴 그리드 -->
      <div style="overflow-y:auto;flex:1;padding:12px 12px 8px">
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:9px">
          ${cards}
        </div>
      </div>

      <!-- 합계 + 주문 버튼 -->
      <div style="padding:10px 14px 18px;flex-shrink:0;border-top:1px solid rgba(255,255,255,0.07)">
        ${totalQty>0?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
          <span style="font-size:13px;color:#9090a0">총 <strong style="color:#ff9d60">${totalQty}개</strong> 선택</span>
          <span style="font-size:16px;font-weight:900;color:#fff">합계 <span style="color:#ff9d60">${fmt(totalPrice)}</span></span>
        </div>`:""}
        <button id="bulk-submit" style="width:100%;height:46px;background:${totalQty>0?"linear-gradient(135deg,#ff9d60,#ffb860)":"rgba(255,255,255,0.06)"};border:none;border-radius:13px;color:${totalQty>0?"#fff":"#333355"};font-size:15px;font-weight:800">
          ${totalQty>0?`🛒 ${totalQty}개 단체주문 완료`:"수량을 선택해주세요"}
        </button>
      </div>
    </div>
  </div>`;
}

          <div style="font-size:16px;font-weight:900;color:#fff">🤝 합석 주문</div>

        </div>
        <button id="join-close" style="background:rgba(255,255,255,0.07);border:none;border-radius:50%;width:30px;height:30px;color:#9090c0;font-size:13px;display:flex;align-items:center;justify-content:center">✕</button>

      <div style="overflow-y:auto;flex:1;padding:14px 15px 20px">

          <button data-cancel-join="${outgoing.docId}" style="margin-top:10px;background:rgba(255,80,80,0.12);border:1px solid rgba(255,80,80,0.28);border-radius:8px;padding:6px 14px;color:#ff8080;font-size:12px;font-weight:700">요청 취소</button>
        </div>`:""}
        <!-- 수락된 합석 팀 표시 -->
        ${accepted.length>0?`<div style="background:rgba(60,200,120,0.08);border:1px solid rgba(60,200,120,0.25);border-radius:12px;padding:11px 14px;margin-bottom:14px">

// ── 라이브보드 ────────────────────────────────────────────────────
function renderLiveBoard(){
  const ticker=S.allOrders.slice(-10).reverse();
  const bars=getOrderedRestaurants().map(r=>{
    const ro=S.allOrders.filter(o=>o.restaurant===r.name); const total=ro.length;
    const teams=[...new Set(ro.map(o=>o.team))];
    const bw=Math.min((total/15)*100,100);
    const bc=total===0?"transparent":total>=10?"#ff6b6b":total>=6?"#ff9d60":"#6c63ff";
    const menuCount={};
    ro.forEach(o=>{if(!menuCount[o.menu])menuCount[o.menu]=0;menuCount[o.menu]++;});
    const menuSummary=Object.entries(menuCount).map(([n,c])=>`<span style="font-size:10px;color:#707090;background:rgba(255,255,255,0.04);border-radius:20px;padding:2px 7px">${n} ${c}개</span>`).join("");
    return `<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:13px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">
        <div style="display:flex;align-items:center;gap:7px"><span style="font-size:20px">${r.emoji}</span><span style="font-size:14px;font-weight:800;color:#fff">${r.name}</span></div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:18px;font-weight:900;color:${total>0?"#ff9d60":"#303050"}">${total}명</span>
          ${total>0?`<button data-sms="${r.name}" style="background:rgba(60,200,120,0.15);border:1px solid rgba(60,200,120,0.3);border-radius:20px;padding:5px 10px;font-size:11px;color:#60c880;font-weight:700">📱</button>`:""}
          ${r.phoneCall||r.phoneSMS?`<button data-call="${r.name}" style="background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);border-radius:20px;padding:5px 10px;font-size:11px;color:#9d97ff;font-weight:700">📞</button>`:""}
        </div>
      </div>
      <div style="background:rgba(255,255,255,0.06);border-radius:20px;height:6px;margin-bottom:6px;overflow:hidden"><div style="height:100%;border-radius:20px;width:${bw}%;background:${bc};transition:width 0.5s ease"></div></div>
      ${teams.length>0?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">${teams.map(t=>`<span style="font-size:10px;background:rgba(108,99,255,0.2);border:1px solid rgba(108,99,255,0.3);border-radius:20px;padding:2px 7px;color:#9d97ff;font-weight:700">${t}</span>`).join("")}</div>`:""}
      ${menuSummary?`<div style="display:flex;gap:4px;flex-wrap:wrap">${menuSummary}</div>`:`<div style="font-size:11px;color:#303050">아직 주문 없음</div>`}
    </div>`;
  }).join("");
  const ti=ticker.length===0?`<div style="text-align:center;color:#404060;font-size:12px;padding:0 20px">주문을 기다리는 중...</div>`
    :`<div style="display:flex;gap:40px;animation:marquee 20s linear infinite;white-space:nowrap">${[...ticker,...ticker].map(o=>`<span style="font-size:12px;color:#c0c0e0;font-weight:600"><span style="color:#9d97ff">${o.team}</span> ${o.member} → <span style="color:#ff9d60">${o.restaurantEmoji}${o.restaurant}</span> ${o.menu}</span>`).join("")}</div>`;
  return `<div style="position:fixed;inset:0;z-index:200;background:#07071a;display:flex;flex-direction:column">
    <div style="padding:15px 17px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.07)">
      <div><div style="font-size:10px;color:#ff6b6b;letter-spacing:3px;font-weight:700">● LIVE</div><div style="font-size:19px;font-weight:900;color:#fff">🍽 오늘 주문 현황</div></div>
      <button id="live-close" style="background:rgba(255,255,255,0.07);border:none;border-radius:10px;padding:6px 13px;color:#9090c0;font-size:13px;font-weight:700">닫기</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:12px 14px 0"><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${bars}</div></div>
    <div style="border-top:1px solid rgba(108,99,255,0.2);background:rgba(108,99,255,0.08);padding:10px 0;overflow:hidden;flex-shrink:0">${ti}</div>
  </div>`;
}

  });

  });
  document.querySelectorAll("[data-accept-join]").forEach(btn=>{
    btn.onclick=()=>acceptJoinRequest(btn.dataset.acceptJoin);
  });

function bindPhoneBook(){
  document.getElementById("pb-bg")?.addEventListener("click",()=>{S.phoneBookOpen=false;S.pbEditId=null;render();});
  document.getElementById("pb-close")?.addEventListener("click",()=>{S.phoneBookOpen=false;S.pbEditId=null;render();});
  // 추가
  document.getElementById("pb-new-name")?.addEventListener("input",e=>S.pbNewName=e.target.value);
  document.getElementById("pb-new-mobile")?.addEventListener("input",e=>S.pbNewMobile=e.target.value);
  document.getElementById("pb-new-tel")?.addEventListener("input",e=>S.pbNewTel=e.target.value);
  document.getElementById("pb-add-btn")?.addEventListener("click",addPhoneBook);
  // 수정
  document.querySelectorAll("[data-pb-edit]").forEach(btn=>{
    btn.onclick=()=>{
      if(!confirm("⚠️ 공용 전화번호부를 수정합니다.\n모든 조에 반영됩니다. 계속하시겠습니까?")) return;
      const pb=S.phoneBooks.find(p=>p.docId===btn.dataset.pbEdit);
      if(pb){S.pbEditId=pb.docId;S.pbEditName=pb.name;S.pbEditMobile=pb.mobile||"";S.pbEditTel=pb.tel||"";render();}
    };
  });
  document.getElementById("pb-edit-name")?.addEventListener("input",e=>S.pbEditName=e.target.value);
  document.getElementById("pb-edit-mobile")?.addEventListener("input",e=>S.pbEditMobile=e.target.value);
  document.getElementById("pb-edit-tel")?.addEventListener("input",e=>S.pbEditTel=e.target.value);
  document.getElementById("pb-save-edit")?.addEventListener("click",savePhoneBookEdit);
  document.getElementById("pb-cancel-edit")?.addEventListener("click",()=>{S.pbEditId=null;render();});
  // 삭제
  document.querySelectorAll("[data-pb-del]").forEach(btn=>{
    btn.onclick=()=>deletePhoneBook(btn.dataset.pbDel,btn.dataset.pbName||"");
  });
}

// ── 단체주문 바인딩 ───────────────────────────────────────────────
function bindBulkOrder(){
  document.getElementById("bulk-close")?.addEventListener("click",()=>{
    S.bulkOrder=null; S.bulkQty={}; render();
  });
  document.getElementById("bulk-submit")?.addEventListener("click",()=>{
    if(Object.values(S.bulkQty).some(q=>q>0)) submitBulkOrder();
    else showToast("⚠️ 수량을 선택해주세요");
  });
  document.querySelectorAll("[data-bulk-plus]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.bulkPlus;
      S.bulkQty={...S.bulkQty,[id]:(S.bulkQty[id]||0)+1};
      render();
    };
  });
  document.querySelectorAll("[data-bulk-minus]").forEach(btn=>{
    btn.onclick=()=>{
      const id=btn.dataset.bulkMinus;
      const cur=S.bulkQty[id]||0;
      if(cur>0){ S.bulkQty={...S.bulkQty,[id]:cur-1}; render(); }
    };
  });
}

function bindMain(){
  document.getElementById("phonebook-tab")?.addEventListener("click",()=>{S.phoneBookOpen=!S.phoneBookOpen;S.pbEditId=null;render();});
  document.getElementById("join-btn")?.addEventListener("click",()=>{S.showJoinPanel=true;render();});
  // 합석 수락/거절 (알림 팝업)
  document.querySelectorAll("[data-accept-join]").forEach(btn=>{btn.onclick=()=>acceptJoinRequest(btn.dataset.acceptJoin);});
  document.querySelectorAll("[data-reject-join]").forEach(btn=>{btn.onclick=()=>rejectJoinRequest(btn.dataset.rejectJoin);});
  document.getElementById("chief-btn")?.addEventListener("click",()=>{
    S.chiefMode=!S.chiefMode;
    render();
    if(S.chiefMode) showToast("👑 총무 모드 ON — 모든 팀원 주문 가능");
    else showToast("👤 일반 모드 — 내 주문만 가능");
  });
  document.getElementById("notice-btn")?.addEventListener("click",()=>{S.noticePopup=true;render();});
  document.getElementById("live-btn")?.addEventListener("click",()=>{S.liveBoard=true;render();});
  document.getElementById("settings-btn")?.addEventListener("click",()=>{S.settings=true;render();});
  document.getElementById("reset-btn")?.addEventListener("click",resetMyOrders);
  // 식당 탭 클릭 → 선택만 (팝업 안 열림)
  document.querySelectorAll("[data-rtab]").forEach(btn=>{
    btn.onclick=()=>{
      const r=S.restaurants.find(r=>r.docId===btn.dataset.rtab);
      if(!r) return;
      S.selectedRestaurantId=btn.dataset.rtab;
      S.restaurantMenuPopup=null;
      if(!S.seenRestaurantIds.includes(r.docId)){
        S.seenRestaurantIds.push(r.docId);
        localStorage.setItem("seenRestaurantIds",JSON.stringify(S.seenRestaurantIds));
      }
      render();
    };
  });
  // 메뉴보기 div 클릭 → 팝업 오픈
  document.querySelectorAll("[data-show-menu]").forEach(el=>{
    el.onclick=(e)=>{
      e.stopPropagation();
      const r=S.restaurants.find(r=>r.docId===el.dataset.showMenu);
      if(r){S.restaurantMenuPopup=r.docId;render();}
    };
  });

  // 식당 메뉴 팝업
  document.getElementById("rmp-bg")?.addEventListener("click",()=>{S.restaurantMenuPopup=null;render();});
  document.getElementById("rmp-close")?.addEventListener("click",()=>{S.restaurantMenuPopup=null;render();});
  document.getElementById("rmp-order")?.addEventListener("click",()=>{
    S.restaurantMenuPopup=null; render(); showToast("👆 팀원을 선택해주세요");
  });
  document.getElementById("rmp-bulk")?.addEventListener("click",()=>{
    const docId=S.restaurantMenuPopup;
    S.restaurantMenuPopup=null; S.bulkOrder=docId; S.bulkQty={}; render();
  });
  document.querySelectorAll("[data-member]").forEach(btn=>{
    btn.onclick=()=>{
      if(!S.selectedRestaurantId){showToast("⚠️ 먼저 식당을 선택해주세요");return;}
      const m=S.myTeam.members?.find(m=>m.id===btn.dataset.member);if(!m)return;
      // 총무모드 아닐 때: 내 이름 미설정이면 이 이름으로 저장
      if(!S.chiefMode){
        if(!S.myMemberId){
          S.myMemberId=m.id;
          localStorage.setItem("myMemberId",m.id);
          showToast(`👤 ${m.name}님으로 등록됐어요`);
        } else if(m.id!==S.myMemberId){
          showToast("👆 내 이름을 선택해주세요. 총무모드에서 다른 사람 주문 가능");
          return;
        }
      }
      S.menuSheet={member:m}; S.selectedMenu=null; S.restaurantMenuPopup=null; render();
    };
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{btn.onclick=async()=>{await deleteDoc(doc(db,"orders",btn.dataset.delete));};});
  document.querySelectorAll("[data-settlement]").forEach(btn=>{
    btn.onclick=()=>{S.showSettlement=btn.dataset.settlement;render();};
  });
  document.getElementById("settle-close")?.addEventListener("click",()=>{S.showSettlement=false;render();});
  document.querySelectorAll("[data-sms-main]").forEach(btn=>{btn.onclick=()=>sendSMS(btn.dataset.smsMain);});
  document.querySelectorAll("[data-call-main]").forEach(btn=>{btn.onclick=()=>callRestaurant(btn.dataset.callMain);});

  // 빠른추가 인원 삭제
  document.querySelectorAll("[data-quick-remove]").forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const t=S.myTeam; if(!t) return;
      const newMembers=(t.members||[]).filter(m=>m.id!==btn.dataset.quickRemove);
      await setDoc(doc(db,"teams",t.docId),{...t,members:newMembers});
    };
  });

  // 최근주문 탭 토글
  document.getElementById("recent-tab-toggle")?.addEventListener("click",()=>{S.recentTab=!S.recentTab;render();});

  // 최근 주문 상세

  document.getElementById("recent-detail-close")?.addEventListener("click",()=>{S.recentDetailIdx=null;render();});

  // 공지사항 팝업
  document.getElementById("notice-bg")?.addEventListener("click",()=>{S.noticePopup=false;S.noticeAdminMode=false;S.noticeEditId=null;render();});
  document.getElementById("notice-close")?.addEventListener("click",()=>{S.noticePopup=false;S.noticeAdminMode=false;S.noticeEditId=null;render();});
  document.getElementById("notice-admin-toggle")?.addEventListener("click",()=>{
    if(S.noticeAdminMode){S.noticeAdminMode=false;render();return;}
    const pw=document.getElementById("admin-pw-section");
    if(pw) pw.style.display=pw.style.display==="none"?"block":"none";
    else{S.noticeAdminPw="";render();}
  });
  document.getElementById("notice-pw-input")?.addEventListener("input",e=>S.noticeAdminPw=e.target.value);
  document.getElementById("notice-pw-confirm")?.addEventListener("click",()=>{
    if(S.noticeAdminPw===ADMIN_PW){S.noticeAdminMode=true;S.noticeAdminPw="";render();}

  });

  // 인원 빠른 추가
  document.getElementById("add-member-quick")?.addEventListener("click",()=>{S.quickAddMode=true;S.quickAddName="";render();setTimeout(()=>document.getElementById("quick-add-input")?.focus(),50);});

    let name=S.quickAddName.trim();
    if(!name){
      const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const used=existing.map(m=>m.name);
      for(let i=0;i<letters.length;i++){
        if(!used.includes(letters[i])){ name=letters[i]; break; }
      }
      if(!name) name=`팀원${existing.length+1}`;
    }
    const no=existing.length+1;
    const nm=[...existing,{id:uid(),no,name,isQuick:true}];
    await setDoc(doc(db,"teams",t.docId),{...t,members:nm});
    S.quickAddMode=false; S.quickAddName="";
    showToast(`✅ ${name} 추가`);
  });
}
function bindMenuSheet(){
  document.getElementById("ms-bg")?.addEventListener("click",()=>{S.menuSheet=null;S.selectedMenu=null;S.multiSelect=false;S.selectedMenus=[];render();});
  document.getElementById("ms-close")?.addEventListener("click",()=>{S.menuSheet=null;S.selectedMenu=null;S.multiSelect=false;S.selectedMenus=[];render();});

  // 복수선택 토글
  document.getElementById("ms-multi-toggle")?.addEventListener("click",()=>{
    S.multiSelect=!S.multiSelect;
    S.selectedMenus=[];
    S.selectedMenu=null;
    render();
  });

  // 복수선택 주문 버튼
  document.getElementById("ms-multi-submit")?.addEventListener("click",async()=>{
    if(S.selectedMenus.length>0) await submitMultiOrder(S.menuSheet?.member);
  });

  // 탭 전환
  document.querySelectorAll("[data-menu-tab]").forEach(btn=>{
    btn.onclick=()=>{S.menuSheetTab=btn.dataset.menuTab;render();};
  });

  // 최근 주문 빠른 선택
  document.querySelectorAll("[data-menu-recent]").forEach(btn=>{
    btn.onclick=async()=>{
      const r=getSelR(); const member=S.menuSheet?.member; if(!r||!member) return;
      const menuId=btn.dataset.menuRecent;
      const menuName=btn.dataset.menuName;
      const menu=menuId?r.menus?.find(m=>m.id===menuId):r.menus?.find(m=>m.name===menuName);
      if(!menu) return;
      if(S.multiSelect){
        S.selectedMenus=[...S.selectedMenus,{id:menu.id,name:menu.name,price:menu.price}];
        render();
      } else {
        await submitOrder(member,menu);
      }
    };
  });

  // 메뉴 선택
  document.querySelectorAll("[data-menu]").forEach(btn=>{
    btn.onclick=async()=>{
      const r=getSelR(); const menu=r?.menus?.find(m=>m.id===btn.dataset.menu); const member=S.menuSheet?.member;
      if(!menu||!member) return;
      if(S.multiSelect){
        // 복수선택: 탭할 때마다 추가, 같은 메뉴 또 탭하면 하나 제거
        const idx=S.selectedMenus.findIndex(m=>m.id===menu.id);
        if(idx>=0){
          S.selectedMenus=S.selectedMenus.filter((_,i)=>i!==idx);
        } else {
          S.selectedMenus=[...S.selectedMenus,{id:menu.id,name:menu.name,price:menu.price}];
        }
        render();
      } else {
        // 단일선택: 바로 주문
        S.selectedMenu=menu;
        document.querySelectorAll("[data-menu]").forEach(b=>{
          const a=b.dataset.menu===menu.id;
          b.style.background=a?"rgba(108,99,255,0.35)":"rgba(255,255,255,0.05)";
          b.style.borderColor=a?"rgba(108,99,255,0.8)":"rgba(255,255,255,0.09)";
        });
        await submitOrder(member,menu);
      }
    };
  });
}

  document.getElementById("edit-mname")?.addEventListener("input",e=>S.editMemberName=e.target.value);
  document.querySelectorAll("[data-rm-member]").forEach(btn=>{btn.onclick=()=>removeMember(btn.dataset.rmMember);});
  document.getElementById("inp-remoji")?.addEventListener("input",e=>S.newRestaurantEmoji=e.target.value);
  document.getElementById("inp-rname")?.addEventListener("input",e=>S.newRestaurantName=e.target.value);
  document.getElementById("add-r-btn")?.addEventListener("click",addRestaurant);
  document.querySelectorAll("[data-rm-r]").forEach(btn=>{btn.onclick=()=>removeRestaurant(btn.dataset.rmR,btn.dataset.rmName||"");});
  document.querySelectorAll("[data-open-popup]").forEach(btn=>{
    btn.onclick=()=>{
      const r=S.restaurants.find(r=>r.docId===btn.dataset.openPopup);
      if(r){S.restaurantPopup=r.docId;S.popupRestaurantName=r.name;S.popupRestaurantEmoji=r.emoji;S.showEmojiPicker=false;S.popupRestaurantPhoneSMS=r.phoneSMS||"";S.popupRestaurantPhoneCall=r.phoneCall||"";S.popupNewMenuName="";S.popupNewMenuPrice="";S.popupEditMenuId=null;render();}
    };
  });
  document.querySelectorAll("[data-order-up]").forEach(btn=>{btn.onclick=()=>moveRestaurant(btn.dataset.orderUp,"up");});
  document.querySelectorAll("[data-order-down]").forEach(btn=>{btn.onclick=()=>moveRestaurant(btn.dataset.orderDown,"down");});

  // 스킨 선택
  document.querySelectorAll("[data-skin]").forEach(btn=>{
    btn.onclick=()=>{
      S.skin=btn.dataset.skin;
      localStorage.setItem("skin",S.skin);
      render();
    };
  });

  // 폰트 설정
  document.querySelectorAll("[data-font-family]").forEach(btn=>{
    btn.onclick=()=>{
      S.fontFamily=btn.dataset.fontFamily;
      localStorage.setItem("fontFamily",S.fontFamily);
      render();
    };
  });
  document.querySelectorAll("[data-font-minus]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.fontMinus;
      const mins={"restaurant":10,"member":9,"menu":9,"summary":9};
      if(S.fontSizes[key]>mins[key]) S.fontSizes[key]--;
      localStorage.setItem("fontSizes",JSON.stringify(S.fontSizes));
      render();
    };
  });
  document.querySelectorAll("[data-font-plus]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.fontPlus;
      const maxs={"restaurant":20,"member":18,"menu":18,"summary":18};
      if(S.fontSizes[key]<maxs[key]) S.fontSizes[key]++;
      localStorage.setItem("fontSizes",JSON.stringify(S.fontSizes));
      render();
    };
  });
  document.getElementById("font-reset")?.addEventListener("click",()=>{
    S.skin="dark"; S.fontFamily="default";
    S.fontSizes={"restaurant":14,"member":13,"menu":13,"summary":13};
    localStorage.setItem("skin","dark");
    localStorage.setItem("fontFamily","default");
    localStorage.setItem("fontSizes",JSON.stringify(S.fontSizes));
    render();
  });
}
