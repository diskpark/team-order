// ── 초기화 체크 ───────────────────────────────────────────────────
function checkReady(){
  if(!S.loadedTeams || !S.loadedRestaurants) return;
  if(S.screen === "loading"){
    if(S.myTeamDocId){
      const f = S.teams.find(t=>t.docId===S.myTeamDocId);
      if(f){ S.myTeam=f; S.screen="main"; loadRestaurantOrder().then(()=>render()); return; }
    }
    S.screen = "teamSelect";
  }
  render();
}

// ── Firebase ──────────────────────────────────────────────────────
function initFirebase(){
  onSnapshot(collection(db,"teams"), snap=>{
    if(snap.empty && !S.dataInitialized){
      S.dataInitialized=true; saveDefaultData(); return;
    }
    S.teams = snap.docs.map(d=>({...d.data(),docId:d.id}));
    S.teams.sort((a,b)=>{const na=parseInt(a.name),nb=parseInt(b.name);return isNaN(na)||isNaN(nb)?a.name.localeCompare(b.name,'ko'):na-nb;});
    if(S.myTeam) S.myTeam = S.teams.find(t=>t.docId===S.myTeam.docId)||S.myTeam;
    S.loadedTeams = true;
    checkReady();
  });
  onSnapshot(collection(db,"restaurants"), snap=>{
    S.restaurants = snap.docs.map(d=>({...d.data(),docId:d.id}));
    if(!S.selectedRestaurantId && S.restaurants.length>0)
      S.selectedRestaurantId = getOrderedRestaurants()[0]?.docId || S.restaurants[0].docId;
    S.loadedRestaurants = true;
    checkReady();
  });
  onSnapshot(collection(db,"orders"), snap=>{
    const today=todayKey(); const now=Date.now(); const TWO_H=2*60*60*1000;
    const all=snap.docs.map(d=>({...d.data(),docId:d.id}));
    S.allOrders = all.filter(o=>o.date===today && !(o.timestamp&&(now-o.timestamp)>TWO_H));
    // cleanup expired
    const expired=all.filter(o=>o.date!==today||(o.timestamp&&(now-o.timestamp)>TWO_H));
    if(expired.length>0){
      const b=writeBatch(db);
      expired.forEach(o=>b.delete(doc(db,"orders",o.docId)));
      b.commit().catch(()=>{});
    }
    if(S.screen==="main") render();
  });
}

async function saveDefaultData(){
  const batch=writeBatch(db);
  DEFAULT_TEAMS.forEach(t=>batch.set(doc(db,"teams",t.id),t));
  DEFAULT_RESTAURANTS.forEach(r=>batch.set(doc(db,"restaurants",r.id),r));
  await batch.commit();
}

// ── 최근 주문 (문자 전송 기록) ───────────────────────────────────
async function saveRecentOrder(restaurantName, orders){
  if(!S.myTeam) return;
  const record = {
    restaurantName,
    restaurantEmoji: S.restaurants.find(r=>r.name===restaurantName)?.emoji||"🍽",
    orders: orders.map(o=>({member:o.member, menu:o.menu, price:o.price})),
    total: orders.reduce((s,o)=>s+o.price,0),
    sentAt: new Date().toLocaleString("ko-KR",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"}),
    date: todayKey(),
    timestamp: Date.now()
  };
  const existing = S.recentOrders;
  const newList = [record, ...existing].slice(0,10); // 최근 10개
  S.recentOrders = newList;
  try{
    await setDoc(doc(db,"recentOrders",S.myTeam.docId),{orders:newList, teamId:S.myTeam.docId});
  }catch(e){}
}
async function loadRecentOrders(){
  if(!S.myTeam) return;
  try{
    const d = await getDoc(doc(db,"recentOrders",S.myTeam.docId));
    S.recentOrders = d.exists()?(d.data().orders||[]):[];
  }catch(e){S.recentOrders=[];}
}

// ── 식당 순서 ─────────────────────────────────────────────────────
function getOrderedRestaurants(){
  if(!S.restaurantOrder || S.restaurantOrder.length===0) return [...S.restaurants];
  const ordered=[];
  S.restaurantOrder.forEach(id=>{const r=S.restaurants.find(r=>r.docId===id);if(r)ordered.push(r);});
  S.restaurants.forEach(r=>{if(!S.restaurantOrder.includes(r.docId))ordered.push(r);});
  return ordered;
}
async function loadRestaurantOrder(){
  if(!S.myTeam) return;
  try{
    const d=await getDoc(doc(db,"teamRestaurantOrder",S.myTeam.docId));
    S.restaurantOrder = d.exists()?(d.data().order||[]):[];
  }catch(e){S.restaurantOrder=[];}
}
async function saveRestaurantOrder(order){
  if(!S.myTeam) return;
  S.restaurantOrder=order;
  await setDoc(doc(db,"teamRestaurantOrder",S.myTeam.docId),{order,teamId:S.myTeam.docId});
}
async function moveRestaurant(docId,dir){
  const list=getOrderedRestaurants().map(r=>r.docId);
  const idx=list.indexOf(docId); if(idx===-1) return;
  if(dir==="up"&&idx===0) return;
  if(dir==="down"&&idx===list.length-1) return;
  const swap=dir==="up"?idx-1:idx+1;
  [list[idx],list[swap]]=[list[swap],list[idx]];
  await saveRestaurantOrder(list); render();
}

// ── 토스트 ────────────────────────────────────────────────────────
function showToast(msg){
  if(S.toastTimer) clearTimeout(S.toastTimer);
  S.toast=msg;
  S.toastTimer=setTimeout(()=>{S.toast=null;render();},2200);
  render();
}

// ── 주문 ─────────────────────────────────────────────────────────
function getMyOrder(memberName){ return S.allOrders.find(o=>o.team===S.myTeam?.name&&o.member===memberName); }
function countByR(rName){ return S.allOrders.filter(o=>o.restaurant===rName).length; }
function getSelR(){ return S.restaurants.find(r=>r.docId===S.selectedRestaurantId); }

async function submitOrder(member,menu){
  const r=getSelR(); if(!r||!member||!menu) return;
  const order={team:S.myTeam.name,member:member.name,restaurant:r.name,restaurantEmoji:r.emoji,menu:menu.name,price:menu.price,at:new Date().toLocaleTimeString("ko-KR",{hour:"2-digit",minute:"2-digit"}),date:todayKey(),timestamp:Date.now()};
  try{
    const ex=S.allOrders.find(o=>o.team===S.myTeam.name&&o.member===member.name);
    if(ex?.docId) await deleteDoc(doc(db,"orders",ex.docId));
    await addDoc(collection(db,"orders"),order);
    S.menuSheet=null; S.selectedMenu=null;
    showToast(`✅ ${member.name} · ${menu.name}`);
  }catch(e){showToast("❌ 저장 실패");}
}

async function resetMyOrders(){
  if(!confirm(`${S.myTeam.name} 전체 주문을 초기화할까요?`)) return;
  const b=writeBatch(db);
  S.allOrders.filter(o=>o.team===S.myTeam.name).forEach(o=>b.delete(doc(db,"orders",o.docId)));
  await b.commit(); showToast("🗑 초기화 완료");
}

// ── SMS ───────────────────────────────────────────────────────────
function buildSMSBody(rData,orders){
  const menuCount={};
  orders.forEach(o=>{if(!menuCount[o.menu])menuCount[o.menu]={name:o.menu,price:o.price,count:0};menuCount[o.menu].count++;});
  const total=orders.reduce((s,o)=>s+o.price,0);
  const lines=Object.values(menuCount).map(m=>`• ${m.name} ${m.count}개 = ${fmt(m.count*m.price)}`);
  return [`안녕하세요, ${S.myTeam?.name||""} 입니다 :)`,``,`[${rData.emoji||"🍽"} ${rData.name} 주문]`,``,...lines,``,`총 ${orders.length}명 / 합계 ${fmt(total)}`,``,`감사합니다!`].join("\n");
}
function sendSMS(restaurantName){
  const rData=S.restaurants.find(r=>r.name===restaurantName);
  const rOrders=S.allOrders.filter(o=>o.team===S.myTeam?.name&&o.restaurant===restaurantName);
  if(rOrders.length===0){showToast("주문이 없습니다");return;}
  const body=buildSMSBody(rData||{name:restaurantName,emoji:"🍽"},rOrders);
  const phone=(rData?.phoneSMS||"").replace(/[^0-9]/g,"");
  // 최근 주문 저장
  saveRecentOrder(restaurantName, rOrders);
  if(phone) window.location.href=`sms:${phone}?body=${encodeURIComponent(body)}`;
  else{ navigator.clipboard?.writeText(body); showToast("📋 문자번호 없음 — 내용 복사됨"); }
}
function callRestaurant(restaurantName){
  const rData=S.restaurants.find(r=>r.name===restaurantName);
  const phone=(rData?.phoneCall||rData?.phoneSMS||"").replace(/[^0-9]/g,"");
  if(phone) window.location.href=`tel:${phone}`;
  else showToast("⚠️ 전화번호를 먼저 등록해주세요");
}

async function addMember(){
  const t=S.myTeam; if(!t) return;
  const name=S.newMemberName.trim(); if(!name) return;
  const no=parseInt(S.newMemberNo)||((t.members||[]).length+1);
  const nm=[...(t.members||[]),{id:uid(),no,name}]; nm.sort((a,b)=>a.no-b.no);
  await setDoc(doc(db,"teams",t.docId),{...t,members:nm});
  S.newMemberName=""; S.newMemberNo=""; showToast(`✅ ${name} 추가`);
}
async function removeMember(id){
  const t=S.myTeam; if(!t) return;
  await setDoc(doc(db,"teams",t.docId),{...t,members:(t.members||[]).filter(m=>m.id!==id)});
}
async function saveMemberEdit(){
  const t=S.myTeam; if(!t||!S.editMemberId) return;
  const name=S.editMemberName.trim(); if(!name) return;
  const no=parseInt(S.editMemberNo)||0;
  const nm=(t.members||[]).map(m=>m.id===S.editMemberId?{...m,name,no:no||m.no}:m);
  nm.sort((a,b)=>a.no-b.no);
  await setDoc(doc(db,"teams",t.docId),{...t,members:nm});
  S.editMemberId=null; S.editMemberName=""; S.editMemberNo=""; showToast("✅ 수정 완료");
}

  const id=`r_${uid()}`;
  await setDoc(doc(db,"restaurants",id),{id,name,emoji:S.newRestaurantEmoji||"🍽",phoneSMS:"",phoneCall:"",image:null,menus:[]});
  S.newRestaurantName=""; S.newRestaurantEmoji="🍽"; showToast(`✅ ${name} 추가`);
}
async function removeRestaurant(docId,name){
  const first=confirm(`⚠️ "${name}" 식당을 삭제하시겠습니까?\n\n삭제하면 복구할 수 없습니다.`);
  if(!first) return;
  const second=confirm(`🚨 정말로 "${name}"을 삭제합니다.\n메뉴 데이터도 모두 사라집니다.\n\n최종 확인: 삭제하시겠습니까?`);
  if(!second) return;
  await deleteDoc(doc(db,"restaurants",docId));
  const newOrder=S.restaurantOrder.filter(id=>id!==docId);
  if(newOrder.length!==S.restaurantOrder.length) await saveRestaurantOrder(newOrder);
  showToast(`🗑 ${name} 삭제됨`);
}

async function addPopupMenu(){
  const r=S.restaurants.find(r=>r.docId===S.restaurantPopup); if(!r) return;
  const name=S.popupNewMenuName.trim(); const price=parseInt(S.popupNewMenuPrice);
  if(!name||isNaN(price)){showToast("⚠️ 메뉴명과 가격 입력");return;}
  await setDoc(doc(db,"restaurants",r.docId),{...r,menus:[...(r.menus||[]),{id:uid(),name,price}]});
  S.popupNewMenuName=""; S.popupNewMenuPrice=""; showToast(`✅ ${name} 추가`);
}
async function removePopupMenu(menuId){
  const r=S.restaurants.find(r=>r.docId===S.restaurantPopup); if(!r) return;
  await setDoc(doc(db,"restaurants",r.docId),{...r,menus:(r.menus||[]).filter(m=>m.id!==menuId)});
}
async function savePopupMenuEdit(){
  const r=S.restaurants.find(r=>r.docId===S.restaurantPopup); if(!r||!S.popupEditMenuId) return;
  const name=S.popupEditMenuName.trim(); const price=parseInt(S.popupEditMenuPrice);
  if(!name||isNaN(price)) return;
  await setDoc(doc(db,"restaurants",r.docId),{...r,menus:(r.menus||[]).map(m=>m.id===S.popupEditMenuId?{...m,name,price}:m)});
  S.popupEditMenuId=null; S.popupEditMenuName=""; S.popupEditMenuPrice=""; showToast("✅ 수정됨");
}
async function saveRestaurantImage(r,base64){
  await setDoc(doc(db,"restaurants",r.docId),{...r,image:base64}); showToast("✅ 이미지 저장됨");
}

// ── 렌더 ─────────────────────────────────────────────────────────
function render(){
  const app=document.getElementById("app");
  if(!app) return;
  if(S.screen==="loading"){app.innerHTML=`<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px"><div style="font-size:48px">🍽</div><div style="color:#6060a0;font-size:14px">연결 중...</div></div>`;return;}
  if(S.screen==="teamSelect"){app.innerHTML=renderTeamSelect();bindTeamSelect();return;}
  if(S.screen==="main"){
    app.innerHTML=renderMain();
    bindMain();
    if(S.menuSheet) bindMenuSheet();
    if(S.liveBoard) bindLiveBoard();
    if(S.settings) bindSettings();
    if(S.restaurantPopup) bindRestaurantPopup();
  }
}

// ── 조 선택 ──────────────────────────────────────────────────────
function renderTeamSelect(){
  const btns=S.teams.map(t=>`
    <button data-team="${t.docId}" style="background:rgba(108,99,255,0.12);border:1.5px solid rgba(108,99,255,0.28);border-radius:16px;padding:18px 6px;color:#fff;display:flex;flex-direction:column;align-items:center;gap:5px;transition:all 0.18s">
      <span style="font-size:20px">👥</span><span style="font-size:14px;font-weight:800">${t.name}</span><span style="font-size:10px;color:#7070a0">${(t.members||[]).length}명</span>
    </button>`).join("");
  return `<div style="min-height:100vh;background:linear-gradient(160deg,#0d0d1a 0%,#13132a 60%,#0d0d1a 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px">
    <div style="font-size:48px;margin-bottom:12px">🍽</div>
    <h1 style="font-size:24px;font-weight:900;color:#fff;margin:0 0 6px">식사 주문</h1>
    <p style="color:#6060a0;font-size:13px;margin:0 0 28px">몇 조인지 선택해주세요</p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:9px;width:100%;max-width:360px">${btns}</div>
  </div>`;
}
function bindTeamSelect(){
  document.querySelectorAll("[data-team]").forEach(btn=>{
    btn.onmouseenter=()=>btn.style.background="rgba(108,99,255,0.3)";
    btn.onmouseleave=()=>btn.style.background="rgba(108,99,255,0.12)";
    btn.onclick=()=>{
      const t=S.teams.find(t=>t.docId===btn.dataset.team);
      S.myTeam=t; S.myTeamDocId=t.docId; localStorage.setItem("myTeamDocId",t.docId);
      S.restaurantOrder=[]; S.selectedRestaurantId=null;
      S.screen="main";
      Promise.all([loadRestaurantOrder(), loadRecentOrders()]).then(()=>{
        if(!S.selectedRestaurantId){
          const first=getOrderedRestaurants()[0];
          if(first) S.selectedRestaurantId=first.docId;
        }
        render();
      });
    };
  });
}

// ── 라이브보드 ────────────────────────────────────────────────────
function renderLiveBoard(){
  const ticker=S.allOrders.slice(-10).reverse();
  const bars=getOrderedRestaurants().map(r=>{
    const ro=S.allOrders.filter(o=>o.restaurant===r.name); const total=ro.length;
    const teams=[...new Set(ro.map(o=>o.team))];
    const bw=Math.min((total/15)*100,100);
    const bc=total===0?"transparent":total>=10?"#ff6b6b":total>=6?"#ff9d60":"#6c63ff";
    const menuCount={};
    ro.forEach(o=>{if(!menuCount[o.menu])menuCount[o.menu]=0;menuCount[o.menu]++;});
    const menuSummary=Object.entries(menuCount).map(([n,c])=>`<span style="font-size:10px;color:#707090;background:rgba(255,255,255,0.04);border-radius:20px;padding:2px 7px">${n} ${c}개</span>`).join("");
    return `<div style="background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:14px;padding:13px 14px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:7px">
        <div style="display:flex;align-items:center;gap:7px"><span style="font-size:20px">${r.emoji}</span><span style="font-size:14px;font-weight:800;color:#fff">${r.name}</span></div>
        <div style="display:flex;align-items:center;gap:6px">
          <span style="font-size:18px;font-weight:900;color:${total>0?"#ff9d60":"#303050"}">${total}명</span>
          ${total>0?`<button data-sms="${r.name}" style="background:rgba(60,200,120,0.15);border:1px solid rgba(60,200,120,0.3);border-radius:20px;padding:5px 10px;font-size:11px;color:#60c880;font-weight:700">📱</button>`:""}
          ${r.phoneCall||r.phoneSMS?`<button data-call="${r.name}" style="background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);border-radius:20px;padding:5px 10px;font-size:11px;color:#9d97ff;font-weight:700">📞</button>`:""}
        </div>
      </div>
      <div style="background:rgba(255,255,255,0.06);border-radius:20px;height:6px;margin-bottom:6px;overflow:hidden"><div style="height:100%;border-radius:20px;width:${bw}%;background:${bc};transition:width 0.5s ease"></div></div>
      ${teams.length>0?`<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:4px">${teams.map(t=>`<span style="font-size:10px;background:rgba(108,99,255,0.2);border:1px solid rgba(108,99,255,0.3);border-radius:20px;padding:2px 7px;color:#9d97ff;font-weight:700">${t}</span>`).join("")}</div>`:""}
      ${menuSummary?`<div style="display:flex;gap:4px;flex-wrap:wrap">${menuSummary}</div>`:`<div style="font-size:11px;color:#303050">아직 주문 없음</div>`}
    </div>`;
  }).join("");
  const ti=ticker.length===0?`<div style="text-align:center;color:#404060;font-size:12px;padding:0 20px">주문을 기다리는 중...</div>`
    :`<div style="display:flex;gap:40px;animation:marquee 20s linear infinite;white-space:nowrap">${[...ticker,...ticker].map(o=>`<span style="font-size:12px;color:#c0c0e0;font-weight:600"><span style="color:#9d97ff">${o.team}</span> ${o.member} → <span style="color:#ff9d60">${o.restaurantEmoji}${o.restaurant}</span> ${o.menu}</span>`).join("")}</div>`;
  return `<div style="position:fixed;inset:0;z-index:200;background:#07071a;display:flex;flex-direction:column">
    <div style="padding:15px 17px 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,0.07)">
      <div><div style="font-size:10px;color:#ff6b6b;letter-spacing:3px;font-weight:700">● LIVE</div><div style="font-size:19px;font-weight:900;color:#fff">🍽 오늘 주문 현황</div></div>
      <button id="live-close" style="background:rgba(255,255,255,0.07);border:none;border-radius:10px;padding:6px 13px;color:#9090c0;font-size:13px;font-weight:700">닫기</button>
    </div>
    <div style="flex:1;overflow-y:auto;padding:12px 14px 0"><div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">${bars}</div></div>
    <div style="border-top:1px solid rgba(108,99,255,0.2);background:rgba(108,99,255,0.08);padding:10px 0;overflow:hidden;flex-shrink:0">${ti}</div>
  </div>`;
}

    if(S.popupEditMenuId===m.id) return `<div style="background:rgba(108,99,255,0.1);border:1.5px solid rgba(108,99,255,0.4);border-radius:10px;padding:11px;margin-bottom:7px">

        <input id="pop-edit-mname" value="${S.popupEditMenuName}" placeholder="메뉴명" style="flex:1;height:38px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:0 10px;color:#e0e0f0;font-size:13px;outline:none"/>
        <input id="pop-edit-mprice" type="number" value="${S.popupEditMenuPrice}" placeholder="가격" style="width:80px;height:38px;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);border-radius:8px;padding:0 8px;color:#e0e0f0;font-size:13px;outline:none;flex-shrink:0"/>
        <button id="pop-save-menu-edit" style="height:38px;background:linear-gradient(135deg,#6c63ff,#9d97ff);border:none;border-radius:8px;padding:0 12px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0">저장</button>
        <button id="pop-cancel-menu-edit" style="height:38px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:8px;padding:0 10px;color:#9090c0;font-size:12px;flex-shrink:0">취소</button>
      </div>
    </div>`;
    return `<div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:9px;padding:9px 11px;margin-bottom:5px">
      <div style="display:flex;align-items:center;gap:8px;flex:1">
        <span style="font-size:15px;font-weight:800;color:#9d97ff;flex-shrink:0">${fmtShort(m.price)}</span>
        <span style="font-size:13px;font-weight:600;color:#e0e0f0">${m.name}</span>
      </div>
      <div style="display:flex;gap:5px;flex-shrink:0">
        <button data-pop-edit-menu="${m.id}" style="background:rgba(108,99,255,0.15);border:1px solid rgba(108,99,255,0.3);border-radius:7px;padding:5px 9px;color:#9d97ff;font-size:11px;font-weight:700">수정</button>
        <button data-pop-rm-menu="${m.id}" style="background:rgba(255,80,80,0.12);border:1px solid rgba(255,80,80,0.28);border-radius:7px;padding:5px 9px;color:#ff8080;font-size:11px;font-weight:700">삭제</button>
      </div>
    </div>`;
  }).join("");
  return `<div style="position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:16px">
    <div id="popup-bg" style="position:absolute;inset:0;background:rgba(0,0,0,0.82);backdrop-filter:blur(8px)"></div>
    <div style="position:relative;z-index:1;background:#16162e;border:1px solid rgba(255,255,255,0.13);border-radius:20px;width:100%;max-width:440px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;animation:popIn 0.2s ease">
      <div style="padding:15px 16px 12px;border-bottom:1px solid rgba(255,255,255,0.07);flex-shrink:0;display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:center;gap:9px"><span style="font-size:26px">${r.emoji}</span><div><div style="font-size:16px;font-weight:900;color:#fff">${r.name}</div><div style="font-size:11px;color:#5050a0">식당 수정</div></div></div>
        <button id="popup-close" style="background:rgba(255,255,255,0.07);border:none;border-radius:50%;width:32px;height:32px;color:#9090c0;font-size:15px;display:flex;align-items:center;justify-content:center">✕</button>
      </div>
      <div style="overflow-y:auto;flex:1;padding:14px 15px 20px">
        <!-- 이름 -->
        <div style="margin-bottom:10px">
          <div style="font-size:11px;color:#5050a0;font-weight:700;margin-bottom:7px">식당 이름</div>
          <div style="display:flex;gap:7px;margin-bottom:7px">
            <input id="pop-emoji" value="${S.popupRestaurantEmoji}" style="width:48px;height:44px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:9px;padding:0 4px;color:#e0e0f0;font-size:20px;outline:none;text-align:center;flex-shrink:0"/>
            <input id="pop-name" value="${S.popupRestaurantName}" placeholder="식당 이름" style="flex:1;height:40px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:8px;padding:0 11px;color:#e0e0f0;font-size:13px;outline:none"/>
          </div>
        </div>
        <!-- 문자용 번호 -->
        <div style="margin-bottom:8px">
          <div style="font-size:11px;color:#5050a0;font-weight:700;margin-bottom:6px">📱 문자용 번호 <span style="color:#404060;font-weight:400">(휴대폰)</span></div>
          <input id="pop-phone-sms" value="${S.popupRestaurantPhoneSMS}" placeholder="010-0000-0000" type="tel" style="width:100%;height:40px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:8px;padding:0 11px;color:#e0e0f0;font-size:13px;outline:none"/>
        </div>
        <!-- 전화용 번호 -->
        <div style="margin-bottom:12px">
          <div style="font-size:11px;color:#5050a0;font-weight:700;margin-bottom:6px">📞 전화용 번호 <span style="color:#404060;font-weight:400">(일반전화)</span></div>
          <input id="pop-phone-call" value="${S.popupRestaurantPhoneCall}" placeholder="02-0000-0000" type="tel" style="width:100%;height:40px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:8px;padding:0 11px;color:#e0e0f0;font-size:13px;outline:none"/>
        </div>
        <button id="pop-save-info" style="width:100%;height:40px;background:linear-gradient(135deg,#6c63ff,#9d97ff);border:none;border-radius:9px;color:#fff;font-size:13px;font-weight:800;margin-bottom:12px">저장</button>
        <!-- 이미지 -->
        <div style="margin-bottom:14px">
          <div style="font-size:11px;color:#5050a0;font-weight:700;margin-bottom:7px">식단표 이미지</div>
          <label id="popup-img-label" style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.04);border:1.5px dashed rgba(255,255,255,0.1);border-radius:10px;padding:11px 13px;cursor:pointer">
            ${r.image?`<img src="${r.image}" style="width:42px;height:42px;object-fit:cover;border-radius:7px;flex-shrink:0"/><span style="font-size:13px;color:#9d97ff">이미지 변경 (클릭)</span>`:`<span style="font-size:20px">🖼</span><span style="font-size:13px;color:#606080">이미지 추가 (클릭)</span>`}
          </label>
          <input type="file" id="popup-img-input" accept="image/*" style="display:none"/>
        </div>
        <!-- 메뉴 -->
        <div style="font-size:11px;color:#5050a0;font-weight:700;margin-bottom:8px">메뉴 목록 · ${(r.menus||[]).length}개</div>
        ${menuRows||`<div style="font-size:13px;color:#404060;text-align:center;padding:10px 0 14px">메뉴가 없습니다.</div>`}
        <div style="background:rgba(108,99,255,0.07);border:1px solid rgba(108,99,255,0.2);border-radius:12px;padding:12px;margin-top:8px">
          <div style="font-size:11px;color:#7070b0;font-weight:700;margin-bottom:9px">+ 메뉴 추가</div>
          <div style="display:flex;gap:6px">
            <input id="pop-new-mname" placeholder="메뉴 이름" value="${S.popupNewMenuName}" style="flex:1;height:38px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:8px;padding:0 10px;color:#e0e0f0;font-size:13px;outline:none"/>
            <input id="pop-new-mprice" placeholder="가격" type="number" value="${S.popupNewMenuPrice}" style="width:78px;height:38px;background:rgba(255,255,255,0.07);border:1px solid rgba(255,255,255,0.13);border-radius:8px;padding:0 8px;color:#e0e0f0;font-size:13px;outline:none;flex-shrink:0"/>
            <button id="pop-add-menu" style="height:38px;background:linear-gradient(135deg,#6c63ff,#9d97ff);border:none;border-radius:8px;padding:0 12px;color:#fff;font-size:12px;font-weight:700;white-space:nowrap;flex-shrink:0">추가</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

// ── 바인딩 ────────────────────────────────────────────────────────
function bindMain(){
  document.getElementById("live-btn")?.addEventListener("click",()=>{S.liveBoard=true;render();});
  document.getElementById("settings-btn")?.addEventListener("click",()=>{S.settings=true;render();});
  document.getElementById("reset-btn")?.addEventListener("click",resetMyOrders);
  document.querySelectorAll("[data-rtab]").forEach(btn=>{
    btn.onclick=()=>{
      const r=S.restaurants.find(r=>r.docId===btn.dataset.rtab);
      if(!r) return;
      S.selectedRestaurantId=btn.dataset.rtab;
      if(r.image){
        S.imageViewer={image:r.image,name:r.name,emoji:r.emoji};
      } else {
        S.imageViewer=null;
      }
      render();
    };
  });

  // 이미지 뷰어 닫기
  document.getElementById("img-viewer-close")?.addEventListener("click",()=>{S.imageViewer=null;render();});
  document.querySelectorAll("[data-member]").forEach(btn=>{
    btn.onclick=()=>{
      if(!S.selectedRestaurantId){showToast("⚠️ 먼저 식당을 선택해주세요");return;}
      const m=S.myTeam.members?.find(m=>m.id===btn.dataset.member);if(!m)return;
      S.menuSheet={member:m}; S.selectedMenu=null; S.imageViewer=null; render();
    };
  });
  document.querySelectorAll("[data-delete]").forEach(btn=>{btn.onclick=async()=>{await deleteDoc(doc(db,"orders",btn.dataset.delete));};});
  document.querySelectorAll("[data-sms-main]").forEach(btn=>{btn.onclick=()=>sendSMS(btn.dataset.smsMain);});
  document.querySelectorAll("[data-call-main]").forEach(btn=>{btn.onclick=()=>callRestaurant(btn.dataset.callMain);});

  // 빠른추가 인원 삭제
  document.querySelectorAll("[data-quick-remove]").forEach(btn=>{
    btn.onclick=async(e)=>{
      e.stopPropagation();
      const t=S.myTeam; if(!t) return;
      const newMembers=(t.members||[]).filter(m=>m.id!==btn.dataset.quickRemove);
      await setDoc(doc(db,"teams",t.docId),{...t,members:newMembers});
    };
  });

  // 최근 주문 탭
  document.getElementById("recent-toggle")?.addEventListener("click",()=>{S.showRecentOrders=!S.showRecentOrders;render();});
  document.querySelectorAll("[data-recent]").forEach(btn=>{
    btn.onclick=()=>{S.recentDetailIdx=parseInt(btn.dataset.recent);render();};
  });
  document.getElementById("recent-detail-bg")?.addEventListener("click",()=>{S.recentDetailIdx=null;render();});
  document.getElementById("recent-detail-close")?.addEventListener("click",()=>{S.recentDetailIdx=null;render();});

  // 인원 빠른 추가
  document.getElementById("add-member-quick")?.addEventListener("click",()=>{S.quickAddMode=true;S.quickAddName="";render();setTimeout(()=>document.getElementById("quick-add-input")?.focus(),50);});
  document.getElementById("quick-add-cancel")?.addEventListener("click",()=>{S.quickAddMode=false;S.quickAddName="";render();});
  document.getElementById("quick-add-input")?.addEventListener("input",e=>S.quickAddName=e.target.value);
  document.getElementById("quick-add-input")?.addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("quick-add-confirm")?.click();if(e.key==="Escape"){S.quickAddMode=false;render();}});
  document.getElementById("quick-add-confirm")?.addEventListener("click",async()=>{
    const t=S.myTeam;
    const existing=(t.members||[]);
    // 이름 없으면 A B C... 자동
    let name=S.quickAddName.trim();
    if(!name){
      const letters="ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const used=existing.map(m=>m.name);
      for(let i=0;i<letters.length;i++){
        if(!used.includes(letters[i])){ name=letters[i]; break; }
      }
      if(!name) name=`팀원${existing.length+1}`;
    }
    const no=existing.length+1;
    const nm=[...existing,{id:uid(),no,name,isQuick:true}];
    await setDoc(doc(db,"teams",t.docId),{...t,members:nm});
    S.quickAddMode=false; S.quickAddName="";
    showToast(`✅ ${name} 추가`);
  });
}
function bindMenuSheet(){
  document.getElementById("ms-bg")?.addEventListener("click",()=>{S.menuSheet=null;S.selectedMenu=null;render();});
  document.getElementById("ms-close")?.addEventListener("click",()=>{S.menuSheet=null;S.selectedMenu=null;render();});
  document.querySelectorAll("[data-menu]").forEach(btn=>{
    btn.onclick=async()=>{
      const r=getSelR(); const menu=r?.menus?.find(m=>m.id===btn.dataset.menu); const member=S.menuSheet?.member;
      if(!menu||!member) return;
      S.selectedMenu=menu;
      document.querySelectorAll("[data-menu]").forEach(b=>{
        const a=b.dataset.menu===menu.id;
        b.style.background=a?"rgba(108,99,255,0.35)":"rgba(255,255,255,0.05)";
        b.style.borderColor=a?"rgba(108,99,255,0.8)":"rgba(255,255,255,0.09)";
      });
      await submitOrder(member,menu);
    };
  });
}
function bindLiveBoard(){
  document.getElementById("live-close")?.addEventListener("click",()=>{S.liveBoard=false;render();});
  document.querySelectorAll("[data-sms]").forEach(btn=>{btn.onclick=()=>sendSMS(btn.dataset.sms);});
  document.querySelectorAll("[data-call]").forEach(btn=>{btn.onclick=()=>callRestaurant(btn.dataset.call);});
}
function bindSettings(){
  document.getElementById("st-bg")?.addEventListener("click",()=>{S.settings=false;render();});
  document.getElementById("st-close")?.addEventListener("click",()=>{S.settings=false;render();});
  document.getElementById("change-team-btn")?.addEventListener("click",()=>{localStorage.removeItem("myTeamDocId");S.myTeamDocId=null;S.settings=false;S.screen="teamSelect";S.myTeam=null;S.restaurantOrder=[];render();});
  document.querySelectorAll("[data-stab]").forEach(btn=>{btn.onclick=()=>{S.settingsTab=btn.dataset.stab;render();};});
  document.getElementById("inp-no")?.addEventListener("input",e=>S.newMemberNo=e.target.value);
  document.getElementById("inp-name")?.addEventListener("input",e=>S.newMemberName=e.target.value);
  document.getElementById("add-member-btn")?.addEventListener("click",addMember);
  document.querySelectorAll("[data-edit-member]").forEach(btn=>{btn.onclick=()=>{const m=S.myTeam.members?.find(m=>m.id===btn.dataset.editMember);if(m){S.editMemberId=m.id;S.editMemberName=m.name;S.editMemberNo=String(m.no||"");render();}};});
  document.getElementById("save-member-edit")?.addEventListener("click",saveMemberEdit);
  document.getElementById("cancel-member-edit")?.addEventListener("click",()=>{S.editMemberId=null;render();});
  document.getElementById("edit-mno")?.addEventListener("input",e=>S.editMemberNo=e.target.value);
  document.getElementById("edit-mname")?.addEventListener("input",e=>S.editMemberName=e.target.value);
  document.querySelectorAll("[data-rm-member]").forEach(btn=>{btn.onclick=()=>removeMember(btn.dataset.rmMember);});
  document.getElementById("inp-remoji")?.addEventListener("input",e=>S.newRestaurantEmoji=e.target.value);
  document.getElementById("inp-rname")?.addEventListener("input",e=>S.newRestaurantName=e.target.value);
  document.getElementById("add-r-btn")?.addEventListener("click",addRestaurant);
  document.querySelectorAll("[data-rm-r]").forEach(btn=>{btn.onclick=()=>removeRestaurant(btn.dataset.rmR,btn.dataset.rmName||"");});
  document.querySelectorAll("[data-open-popup]").forEach(btn=>{
    btn.onclick=()=>{
      const r=S.restaurants.find(r=>r.docId===btn.dataset.openPopup);
      if(r){S.restaurantPopup=r.docId;S.popupRestaurantName=r.name;S.popupRestaurantEmoji=r.emoji;S.popupRestaurantPhoneSMS=r.phoneSMS||"";S.popupRestaurantPhoneCall=r.phoneCall||"";S.popupNewMenuName="";S.popupNewMenuPrice="";S.popupEditMenuId=null;render();}
    };
  });
  document.querySelectorAll("[data-order-up]").forEach(btn=>{btn.onclick=()=>moveRestaurant(btn.dataset.orderUp,"up");});
  document.querySelectorAll("[data-order-down]").forEach(btn=>{btn.onclick=()=>moveRestaurant(btn.dataset.orderDown,"down");});

  // 폰트 설정
  document.querySelectorAll("[data-font-family]").forEach(btn=>{
    btn.onclick=()=>{
      S.fontFamily=btn.dataset.fontFamily;
      localStorage.setItem("fontFamily",S.fontFamily);
      render();
    };
  });
  document.querySelectorAll("[data-font-minus]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.fontMinus;
      const mins={"restaurant":10,"member":9,"menu":9,"summary":9};
      if(S.fontSizes[key]>mins[key]) S.fontSizes[key]--;
      localStorage.setItem("fontSizes",JSON.stringify(S.fontSizes));
      render();
    };
  });
  document.querySelectorAll("[data-font-plus]").forEach(btn=>{
    btn.onclick=()=>{
      const key=btn.dataset.fontPlus;
      const maxs={"restaurant":20,"member":18,"menu":18,"summary":18};
      if(S.fontSizes[key]<maxs[key]) S.fontSizes[key]++;
      localStorage.setItem("fontSizes",JSON.stringify(S.fontSizes));
      render();
    };
  });
  document.getElementById("font-reset")?.addEventListener("click",()=>{
    S.fontFamily="default";
    S.fontSizes={"restaurant":14,"member":13,"menu":13,"summary":13};
    localStorage.setItem("fontFamily","default");
    localStorage.setItem("fontSizes",JSON.stringify(S.fontSizes));
    render();
  });
}
function bindRestaurantPopup(){
  document.getElementById("popup-bg")?.addEventListener("click",()=>{S.restaurantPopup=null;S.popupEditMenuId=null;render();});
  document.getElementById("popup-close")?.addEventListener("click",()=>{S.restaurantPopup=null;S.popupEditMenuId=null;render();});
  document.getElementById("pop-emoji")?.addEventListener("input",e=>S.popupRestaurantEmoji=e.target.value);
  document.getElementById("pop-name")?.addEventListener("input",e=>S.popupRestaurantName=e.target.value);
  document.getElementById("pop-phone-sms")?.addEventListener("input",e=>S.popupRestaurantPhoneSMS=e.target.value);
  document.getElementById("pop-phone-call")?.addEventListener("input",e=>S.popupRestaurantPhoneCall=e.target.value);
  document.getElementById("pop-save-info")?.addEventListener("click",savePopupInfo);
  const imgLabel=document.getElementById("popup-img-label");
  const imgInput=document.getElementById("popup-img-input");
  imgLabel?.addEventListener("click",()=>imgInput?.click());
  imgInput?.addEventListener("change",e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{const r=S.restaurants.find(r=>r.docId===S.restaurantPopup);if(r)saveRestaurantImage(r,ev.target.result);};
    reader.readAsDataURL(file);
  });
  document.getElementById("pop-new-mname")?.addEventListener("input",e=>S.popupNewMenuName=e.target.value);
  document.getElementById("pop-new-mprice")?.addEventListener("input",e=>S.popupNewMenuPrice=e.target.value);
  document.getElementById("pop-add-menu")?.addEventListener("click",addPopupMenu);
  document.querySelectorAll("[data-pop-edit-menu]").forEach(btn=>{btn.onclick=()=>{const r=S.restaurants.find(r=>r.docId===S.restaurantPopup);const m=r?.menus?.find(m=>m.id===btn.dataset.popEditMenu);if(m){S.popupEditMenuId=m.id;S.popupEditMenuName=m.name;S.popupEditMenuPrice=String(m.price);render();}};});
  document.getElementById("pop-edit-mname")?.addEventListener("input",e=>S.popupEditMenuName=e.target.value);
  document.getElementById("pop-edit-mprice")?.addEventListener("input",e=>S.popupEditMenuPrice=e.target.value);
  document.getElementById("pop-save-menu-edit")?.addEventListener("click",savePopupMenuEdit);
  document.getElementById("pop-cancel-menu-edit")?.addEventListener("click",()=>{S.popupEditMenuId=null;render();});
  document.querySelectorAll("[data-pop-rm-menu]").forEach(btn=>{btn.onclick=()=>removePopupMenu(btn.dataset.popRmMenu);});
}

initFirebase();
</script>
